purpose: List registered tools with their owners and check tool placement, registration and removal records
type: flat
files:
  mod.rs: Recognize tool files, print active catalog commands, entry tools and removed tools, hold tool check findings
  placement_check.rs: Run the tool check; report misplaced, unregistered or undescribed tools and stale references
  removal_records.rs: Report invalid removal records and remaining references to removed tools
directories:
  tests: Verify the registry listing and the tool check through the CLI
