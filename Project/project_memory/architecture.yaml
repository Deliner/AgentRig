purpose: Validate project memory contracts, record check evidence and report recovery and session context
files:
  mod.rs: Memory, decision and invariant consistency checks and the check evidence, table, State and briefing functions its parts offer
  briefing.rs: Give the full North Star and glossary that each session receives when its context starts, naming a file it lacks
  cards.rs: Check that each card in Backlog, Plan and Archive is named by the queue key and its number, holds only its materials, keeps its heading and sections and is ordered after existing cards without a cycle
  exceptions.rs: Match the lint exceptions in files with the exception lists of their decisions
  format.rs: Memory document sections, tables, links and source target paths
  glossary.rs: Check that the glossary is a header followed by entries of a word and its meaning, each word once whatever its letter case
  history.rs: Preserve and name the committed decisions of each checked revision and check invariant history from the fork
  invariant_history.rs: Refuse an invariant change since the fork from the base unless a new decision names it
  revision_memory.rs: Read a committed memory file and locate the memory directory configured at a revision
  oracles.rs: Bind invariant markers to configured executable test discovery
  resume.rs: Combine recorded State with current repository, job and check observations
  source.rs: Inspect supported source syntax for decision and invariant markers
directories:
  tests: Memory, plan and State behavior scenarios and shared memory fixtures
  check_evidence: Persist check results and determine whether checked inputs remain current
