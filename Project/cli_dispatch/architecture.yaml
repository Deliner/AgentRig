purpose: Parse agentrig and agentrig-lint commands and dispatch them to the features that own them
type: flat
files:
  main.rs: AgentRig process entry with hook and lint command dispatch
  standalone_lint.rs: Standalone agentrig-lint process entry and exit reporting
  mod.rs: Declare the command table and the dispatcher that the process entry uses
  commands.rs: Command names, their parse and the validation of their arguments
  dispatch.rs: Run each parsed command through the feature that owns it, loading the project configuration when the command needs it
directories:
  tests: Verify failure guidance and reruns of commands
