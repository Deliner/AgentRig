purpose: Verify generated environment policy, runtime readiness diagnostics and delivery of independent projects
files:
  mod.rs: Declare the Rust behavior tests of environment setup, copy the example project of a language, locate the runtime an installation committed, initialize a project, a Rust one over the example crate, and read its lint findings
  delivery.rs: Install, check, guard and integrate independent Python and Rust projects through their installed launchers
  runtime.rs: Run the runtime of the reported platform, refuse without one and add one with runtime-add
  doctor.rs: Diagnose installed hooks, client registration, tools and runtime compatibility
  recipes.rs: Verify generated recipes run on the project of their justfile whatever root the agent's words name
  defaults.rs: Verify installed Rust and Python lint limits block delivery and accept boundaries, and shipped rule scopes
  coverage.rs: Report affected-map sources and tests left without selected tests through config-check
  toolchain.rs: Verify Rust init and doctor require the rig's Rust version from the project's rustc and init writes the rig's Rust capability section, while Python ones do neither
  rustflags.rs: Verify Rust init copies the project's build.rustflags into the rig's flag list and leaves the Cargo configuration unchanged, and shipped rules report a lowering flag in the list and rustflags in the Cargo configuration
  clippy.rs: Verify a Rust scaffold names its manifest instead of a Clippy command, so lint and the gate report Clippy messages of the AgentRig profile on its crate with the delivered skill of a profile lint, and writes its thresholds into the effective Clippy file, refusing a conflicting value, and a Python scaffold none
directories: {}
