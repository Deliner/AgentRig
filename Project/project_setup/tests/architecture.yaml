purpose: Verify generated environment policy, runtime readiness diagnostics and delivery of independent projects
files:
  mod.rs: Declare the Rust behavior tests of environment setup and locate the runtime an installation committed
  delivery.rs: Install, check, guard and integrate independent Python and Rust projects through their installed launchers
  runtime.rs: Run the runtime of the reported platform, refuse without one and add one with runtime-add
  test_doctor.py: Diagnose installed hooks, client registration, tools and runtime compatibility
  test_lint_defaults.py: Verify installed Rust and Python lint limits block delivery and accept boundaries
  test_coverage.py: Report affected-map sources and tests left without selected tests through config-check
  test_clippy_profile.py: Verify a Rust scaffold delivers the AgentRig Clippy profile equal to the dev gate and its thresholds in the effective Clippy file, refusing a conflicting value, and a Python scaffold none
directories: {}
