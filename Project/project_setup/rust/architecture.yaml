purpose: Support Rust projects in environment setup from their Cargo manifest and Clippy configuration
type: flat
files:
  mod.rs: Declare the Rust project support modules
  cargo.rs: Derive Rust crate roots, crate names and the test manifest from the consumer's Cargo manifest
  clippy.rs: Build the Clippy command with the AgentRig lint profile and complete the consumer's effective Clippy file with its thresholds
