purpose: Initialize agent environments and inspect their readiness
files:
  mod.rs: Generate the environment bundle and read prepared or installed resource contents
  adapters.rs: Generate Git and agent hook adapters
  assets.rs: Scaffold memory and agent instructions
  skills.rs: Ship the canonical skill bodies under their installed names
  cargo.rs: Derive Rust crate roots, crate names and the test manifest from the consumer's Cargo manifest
  claude.rs: Generate and inspect Claude Code client settings
  clippy.rs: Build the Clippy command with the AgentRig lint profile and complete the consumer's effective Clippy file with its thresholds
  coverage.rs: Report source files and tests that a check's affected map leaves without selected tests
  doctor.rs: Check installed runtime, hooks, tools, client readiness and scaffold configuration validity
  lint.rs: Generate supported lint rule examples for the consumer
  runtime.rs: Install the platform launcher and the runtime built for the current platform
  template.rs: Interpret scaffold options and generate project configuration and command adapters
  README.md: Consumer installation, commands, configuration and delivery guide
directories:
  tests: Verify generated lint policy and runtime readiness
  initialization: Initialize the configured environment, keeping existing consumer file contents
