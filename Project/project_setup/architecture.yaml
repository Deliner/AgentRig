purpose: Initialize agent environments and inspect their readiness
files:
  mod.rs: Declare the setup parts and offer init, the doctor, the configuration check, recipes and runtime installation
  README.md: Consumer installation, commands, configuration and delivery guide
directories:
  tests: Verify generated lint policy and runtime readiness
  bundle: Generate the environment files that init installs and recognize the hook registrations they contain
  initialization: Initialize the configured environment, keeping existing consumer file contents
  inspection: Inspect an installed environment's readiness, configuration validity and test coverage
  rust: Read a Rust project's Cargo manifest and compiler flags, complete its Clippy file and require the rig's Rust version
