purpose: Interpret agent hook events and deliver command guards, edit guidance and context reminders
files:
  architecture.yaml: Hook responsibilities and public service boundary
  mod.rs: Dispatch session and tool events using configured project services
  input.rs: Read optional hook state objects and text fields with colocated behavior tests
  guard.rs: Parse the permitted outer shell invocation
  reminder.rs: Track transcript progress and schedule configured context reminders
  transcript.rs: Normalize incremental Codex and Claude transcript input-token observations
  attention.txt: Guidance emitted at an attention interval
  full-refresh.txt: Instructions emitted when a complete discipline refresh is due
directories:
  tests: Hook dispatch, edit guidance and reminder scheduling behavior scenarios
allow:
  - Project/src/scaffold/testing/consumer.py
  - Project/src/paths/mod.rs
  - Project/src/lint/config/mod.rs
  - Project/src/scaffold/mod.rs
  - Project/src/scaffold/config/mod.rs
deny: []
public: [mod.rs, input.rs]
