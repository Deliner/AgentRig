purpose: Execute configured checks against working, staged or revision inputs and record their results
files:
  architecture.yaml: Verification gate responsibilities and dependency boundary
  mod.rs: Prepare checked snapshots, dispatch checks and produce actionable failures
  selection.rs: Map changed paths to configured affected check targets
  README.md: Gate inputs and affected-test selection guide
directories:
  tests: Verify check execution and source selection
allow:
  - Project/src/scaffold/testing/consumer.py
  - Project/src/scaffold/testing/repository.py
  - Project/src/scaffold/config/mod.rs
  - Project/src/scaffold/settings/mod.rs
  - Project/src/scaffold/commands/mod.rs
  - Project/src/scaffold/evidence/mod.rs
  - Project/src/scaffold/memory/mod.rs
  - Project/src/lint/mod.rs
  - Project/src/lint/config/mod.rs
  - Project/src/lint/inventory/mod.rs
  - Project/src/diagnostics/mod.rs
  - Project/src/vcs/mod.rs
deny: []
public: [mod.rs]
