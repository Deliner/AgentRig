purpose: Define and validate project settings independently of loading recovery state or executing workflows
type: flat
files:
  mod.rs: Strict project schema, version constants, YAML reading, project-relative paths and repairable source files
  access.rs: Command access mode, read-only, project or unconfined, as YAML and job records name it
