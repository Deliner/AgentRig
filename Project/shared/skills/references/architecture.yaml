purpose: "Repair source quality findings: comments, unsafe, swallowed errors, disabled tests and broad allows that must carry an owned DECISION: or INVARIANT: reference, leftover debug artifacts, panic paths, release-stripped debug assertions, glob imports that bind a file to another module's whole surface, eager fallback arguments that propagate an error, bare statements that discard a Result or combined value, panic catches, blocking calls inside async code, paths that reach two module levels up through super::super instead of naming the owner, should_panic tests that pass on any panic, items compiled out of every test build, data substituted into a shell command string, and compiler flags kept in a Cargo configuration instead of the rig's flag list"
files: {}
directories:
  replace-comment: "Replace non-reference source comments with owned knowledge or clearer code"
  justify-unsafe: "Justify an unsafe block or function with a recorded reference, or remove the unsafe"
  handle-error: "Handle a swallowed error, or record why it is safe to ignore with a reference"
  lint-levels: "Repair where lint levels are lowered outside the code they govern or without a reference: a broad allow or a silencing flag, and compiler flags kept in a Cargo configuration instead of the rig's flag list"
  remove-debug: "Remove a leftover Rust dbg! macro and keep any value it wrapped"
  handle-panic: "Return or handle a Rust error instead of unwrap, expect, their _err forms, resume_unwind or a panic macro, or justify the panic with a reference"
  firm-up-assertion: "Promote a release-stripped Rust debug_assert or debug-gated assert to a real assert, remove it, or justify the debug-only check with a reference"
  narrow-import: "Replace a glob import with an explicit import list, or justify the deliberate wildcard with a reference"
  eager-to-lazy: "Move a fallback argument that can fail into the lazy *_else closure, or justify the eager evaluation with a reference"
  handle-discarded: "Handle or propagate a Result or combined value instead of dropping it in a bare statement, or justify the ignored outcome with a reference"
  justify-unwind: "Let a Rust panic propagate instead of catching it with catch_unwind or AssertUnwindSafe, or justify the catch at a boundary with a reference"
  await-not-block: "Await a sleep or future instead of blocking an executor thread with thread::sleep or a nested block_on, or justify the intended block with a reference"
  anchor-at-crate: "Replace a super::super path with a crate:: path or a re-export at the parent module, or justify the intended reach with a reference"
  pass-arguments-apart: "Pass each value to a launched program apart from the shell command string instead of substituting it into that string, or justify the shell code with a reference"
  false-pass: "Repair tests that keep the suite green while the behavior they claim goes unchecked: a disabled test, a should_panic test that passes on any panic and an item compiled out of every test build"
