purpose: "Repair source quality findings: comments, unsafe, swallowed errors, disabled tests and broad allows that must carry an owned DECISION: or INVARIANT: reference, leftover debug artifacts, panic paths, release-stripped debug assertions, glob imports that bind a file to another module's whole surface, signature tuples that hide an unnamed record, eager fallback arguments that propagate an error, and bare .ok() statements that discard a Result"
files: {}
directories:
  replace-comment: "Replace non-reference source comments with owned knowledge or clearer code"
  justify-unsafe: "Justify an unsafe block or function with a recorded reference, or remove the unsafe"
  handle-error: "Handle a swallowed exception, or record why the error is safe to ignore with a reference"
  justify-skip: "Re-enable or delete a disabled test, or record why it is skipped with a reference"
  justify-allow: "Remove a broad Rust allow attribute and fix the finding, or record why it is suppressed with a reference"
  remove-debug: "Remove a leftover Rust dbg! macro and keep any value it wrapped"
  handle-panic: "Return or handle a Rust error instead of unwrap, expect or a panic macro, or justify the panic with a reference"
  firm-up-assertion: "Promote a release-stripped Rust debug_assert to a real assert, remove it, or justify the debug-only check with a reference"
  narrow-import: "Replace a glob import with an explicit import list, or justify the deliberate wildcard with a reference"
  name-the-record: "Replace a signature tuple with a named struct, or justify the deliberate small tuple with a reference"
  eager-to-lazy: "Move a fallback argument that can fail into the lazy *_else closure, or justify the eager evaluation with a reference"
  handle-discarded: "Handle or propagate a Result instead of dropping it with a bare .ok() statement, or justify the ignored outcome with a reference"
