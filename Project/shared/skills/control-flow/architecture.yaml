  reduce-branching: "Reduce the decision points per function while preserving behavior"
  split-boolean-expression: "Split long boolean expressions into named parts while preserving behavior"
  subtract-checked: "Make a subtraction from a length checked or saturating, rearrange it away, or justify the guaranteed length with a reference"
