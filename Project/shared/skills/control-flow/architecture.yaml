purpose: "Repair function control-flow complexity and hazards: deep nesting, branch overload, long boolean expressions, unlabeled exits of nested loops and subtractions from a length"
files: {}
directories:
  flatten-nesting: "Reduce control-flow nesting depth while preserving behavior"
