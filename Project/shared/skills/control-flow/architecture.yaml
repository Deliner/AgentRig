purpose: "Repair function control-flow complexity and hazards: deep nesting, branch overload, long or mixed boolean expressions, unlabeled exits of nested loops, exits hidden in a macro body, subtractions from a length, comparisons with one enum variant, chains of integer bounds, a path check before acting on the path, a hand-written list of every variant of an enum, an array literal indexed to select one computed value, a classification of enum variants into true and false repeated in several places, a filter by a known flag on a computed value and a MAX fallback added to or multiplied"
files: {}
directories:
  act-and-match-the-error: "Perform a file action and match its error kind instead of checking the path first, or justify the stable path with an exception"
  branch-on-the-index: "Select one value with match or if on the index instead of indexing an array literal whose elements call, or justify computing every element with an exception"
  check-the-flag-first: "Check a flag before the call whose result a filter ignoring its value would keep or drop, or justify running the call regardless with an exception"
  classify-in-the-enum: "Move a classification of enum variants into true and false repeated in several places into one method of the enum, or justify the copy with an exception"
  derive-the-variants: "Derive a list of every variant of an enum from its declaration instead of writing it by hand, or justify the selection with an exception"
  expose-the-exit: "Write the exit of a macro at its call site, name the macro after its exit, or justify the hidden exit with an exception"
  flatten-nesting: "Reduce control-flow nesting depth while preserving behavior"
  label-the-exit: "Label the loop an exit of a nested loop leaves, extract the inner loop, or justify the unlabeled exit with an exception"
  match-every-variant: "Replace a comparison with one enum variant with an exhaustive match, or justify the comparison with an exception"
  match-the-ranges: "Replace a chain of comparisons of one value with integer bounds by a match on range patterns, or justify the chain with an exception"
  reduce-branching: "Reduce the decision points per function while preserving behavior"
  saturate-or-handle: "Handle the missing value before adding to or multiplying a MAX fallback, or saturate explicitly, or justify the unreachable fallback with an exception"
  split-boolean-expression: "Split long boolean expressions, and those joining conjunctions with disjunctions, into named parts while preserving behavior"
  subtract-checked: "Make a subtraction from a length or a bit count checked or saturating, rearrange it away, or justify the guaranteed count with an exception"
