purpose: "Decompose an oversized or ill-structured unit by responsibility, name and group a tree's parts so they show each directory's job, move long embedded text or a misplaced test file where it belongs, rewrite a superseded form in its current one or a program in an allowed language, or correct a standard call whose argument misstates its intent, while preserving its contract"
files: {}
directories:
  clarify-structure: "Rename, split and group the parts of a Rust tree by lint-structure scores so their names show what each directory does"
  drop-the-dot: "Write the extension passed to with_extension or set_extension without its leading dot, or justify the dot with an exception"
  extract-embedded-text: "Move long string literals out of code into their own files while preserving their values"
  name-the-tolerance: "Replace f32::EPSILON or f64::EPSILON compared as an absolute tolerance with a named tolerance scaled to the values, or justify it with an exception"
  refactor-large-directory: "Guide structural work by responsibility and change boundaries, and repair architecture findings"
  refactor-large-file: "Decompose oversized source files by cohesive responsibility"
  refactor-long-function: "Simplify oversized functions while preserving observable behavior"
  relocate-tests: "Move Rust or Python test code into the tests/ directory of the code it tests while its tests keep seeing the same code"
  rewrite-in-allowed-language: "Rewrite a program in a language the project does not allow in one of its allowed languages and delete the original"
  use-the-current-form: "Replace a Rust form the project's toolchain supersedes with its direct standard form, or justify keeping it with an exception"
