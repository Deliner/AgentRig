purpose: "Give a resource, a lock guard, the data a lock protects, process-global state, a recursive file-system deletion, a checked value, a wrapper's inner value, a newtype's construction, a call pair, a test's network port or the terminal's output an owner with a bounded responsibility, or justify the intended departure with an exception"
files: {}
directories:
  bind-port-zero: "Let a test bind port 0 and read the port the system assigns instead of a fixed port, or justify the fixed port with an exception"
  own-the-resource: "Let a Rust value drop or hold its guard instead of defeating RAII, or justify the intended leak with an exception"
  release-the-guard: "Release a std lock guard before the next .await, switch to an async-aware lock, or justify holding it across the suspension with an exception"
  scope-the-guard: "Replace a visible function returning a lock guard or a RefCell borrow with one that runs a closure over the guarded value, or justify handing out the guard with an exception"
  lock-the-data: "Move the data a unit lock protects inside the lock, or justify the external resource it serializes with an exception"
  own-the-state: "Give process-global mutable state an owner instead of a static lock or a public static cell, or justify the intended global with an exception"
  contain-the-deletion: "Delete a directory tree through an owner that checks the path lies inside its own area, or justify the intended recursive deletion with an exception"
  hide-checked-field: "Make a field that a checking constructor fills private and read it through a method, or justify the visible field with an exception"
  delegate-not-deref: "Replace Deref or DerefMut of a wrapper with methods that delegate what callers need, or justify the deref with an exception"
  construct-explicitly: "Replace From of a raw value for a newtype with a named constructor or a checking TryFrom, or justify the conversion with an exception"
  guard-the-pair: "Close a configured call pair on every path through a guard, or justify the early exit with an exception"
  print-through-one-owner: "Remove a leftover print macro or write output through the one module that owns the terminal, which an exception justifies"
