# Flat skill symlinks preserve existing hook and client instruction paths.
# Their canonical bodies are inventoried under their subgroup; discovery skips symlink aliases.
# Installed skill names remain flat through project_setup/bundle/skills.rs.
purpose: "Provide canonical agent guidance for delivery, architectural repair and project memory"
files: {}
directories:
  complexity-discipline: "Keep implementation and workflow complexity within current requirements"
  condense-markdown: "Keep README and AGENTS.md within limits, copies of one text identical and other Markdown out of Project"
  control-flow: "Repair function control-flow complexity and hazards: deep nesting, branch overload, long or mixed boolean expressions, unlabeled exits of nested loops, exits hidden in a macro body, subtractions from a length or a time, comparisons with one enum variant and wildcard arms of a match on an enum, chains of integer bounds, a path check before acting on the path and a hand-written list of every variant of an enum"
  develop-tools: "Develop, repair and remove registered project tools without duplicating capabilities"
  execute-plan-feature: "Deliver planned features through verified atomic changes and integration"
  refactor: "Decompose an oversized or ill-structured unit by responsibility, name and group a tree's parts so they show each directory's job, move long embedded text, a misplaced test file or a module file kept beside its directory where it belongs, rewrite a superseded form in its current one or a program in an allowed language, or correct a standard call whose argument misstates its intent, while preserving its contract"
  remove-secret: "Remove a hardcoded credential from source and move it to configuration or a secret store"
  repair: "Diagnose and repair configuration and verification failures"
  references: "Repair source comments and sites, such as unsafe, that only an approved DECISION: DNNN RULE exception keeps"
  ownership: "Give a resource, a lock guard, the data a lock protects, process-global state, a recursive file-system deletion, a checked value, a wrapper's inner value, a newtype's construction, a call pair, a test's network port or the terminal's output an owner with a bounded responsibility, or justify the intended departure with an exception"
  signature: "Repair function and type interface smells: excessive inputs, boolean flag parameters, tuples that hide an unnamed record, an order that disagrees with equality, a derived enum order that follows declaration order, a derived Debug that prints a secret, a derived Deserialize that skips a constructor's check, an alias of a primitive, a manual comparison, hash, copy or Debug that reads a subset of fields, a .. after every field of a pattern, a trait default that ignores self, a conversion whose target type comes from a later use and a method that returns Self without must_use"
  naming: "Bind a value to its place by a name instead of its position or an inline expression: same-type parameters and tuple fields, a bool among tuple fields, the states of an optional flag, a nested option or a struct's flags, positional format placeholders and plain variables passed to a format string, struct literal fields set from another field's name and inline branch conditions"
  values: "Repair how code converts, computes, stores, reads and iterates values where the Clippy profile reports a hazard: an as conversion, a decimal ^ that reads as a power, the host's byte order, a read into an empty vector, a large local array, a loop over a hash collection, a collection never read, an iterator that may never end and a binding spread over assignments"
  discipline: "Review disciplines without an executable oracle: test placement, type-driven modelling, fail-closed verdicts and approved changes of enforcement"
  memory: "Capture ideas and maintain plans, decisions, invariants and recovery facts"
