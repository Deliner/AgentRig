# Flat skill symlinks preserve existing hook and client instruction paths.
# Their canonical bodies are inventoried under their subgroup; discovery skips symlink aliases.
# Installed skill names remain flat through project_setup/assets.rs.
purpose: "Provide canonical agent guidance for delivery, architectural repair and project memory"
files: {}
directories:
  complexity-discipline: "Keep implementation and workflow complexity within current requirements"
  condense-markdown: "Keep README and AGENTS.md within limits and other Markdown out of Project"
  control-flow: "Repair function control-flow complexity: deep nesting and branch overload"
  develop-tools: "Develop, repair and remove registered project tools without duplicating capabilities"
  execute-plan-feature: "Deliver planned features through verified atomic changes and integration"
  name-if-condition: "Repair unnamed branch conditions while preserving their meaning"
  refactor: "Decompose an oversized or ill-structured unit by responsibility while preserving its contract"
  remove-secret: "Remove a hardcoded credential from source and move it to configuration or a secret store"
  repair: "Diagnose and repair configuration and verification failures"
  references: "Repair source that must carry an owned DECISION: or INVARIANT: reference: comments and unsafe"
  ownership: "Give a resource, process-global state or a recursive file-system deletion an owner with a bounded responsibility, or justify the intended exception with a reference"
  signature: "Repair function-signature smells: excessive inputs, boolean flag parameters and tuples that hide an unnamed record"
  testing-discipline: "Place tests by behavior and test through the public surface"
  memory: "Capture ideas and maintain plans, decisions, invariants and recovery facts"
