purpose: Repository access, path patterns, source parsing, diagnostics, artifacts, skills and test support shared by features
group: true
files:
  mod.rs: Shared module declarations
directories:
  atomic_files: Read, fingerprint and atomically persist shared file artifacts
  calling_agent: Name the coding agents, their skill directories and the skill path shown to the calling agent
  console: Own console output for the product with line writers for stdout and stderr and a flushed prompt
  diagnostics: Render failures and actionable repair guidance and validate referenced skills
  fs_with_context: Own filesystem access for the product with errors naming the action and the path
  parallel_map: Apply one function to many items on the available threads with results in item order
  paths: Resolve filesystem paths and match repository glob patterns consistently across capabilities
  shared_options: Shared command argument extraction
  skills: Canonical agent guidance embedded into installed environments
  source_parsers: Parse supported source files into syntax trees for lint measurements and memory markers
  strict_yaml: Decode and encode strict YAML configuration
  testing: Construct configured consumer projects and example deliveries for behavior tests
  vcs: Observe and change Git repositories for delivery workflows
