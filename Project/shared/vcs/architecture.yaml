purpose: Provide Git repository observation, queries, exports, hook registration and controlled commands shared by features
type: flat
dependents: 13
files:
  mod.rs: Offer the repository, its settings, revision pairs, tree entries, hook generation and observation
  branches.rs: The base and feature prefix branch settings with their validation
  directories.rs: Discover maintained directories with Git ignore semantics
  export.rs: Export validated repository trees into isolated directories
  git.rs: Execute Git queries over revision pairs and decode repository contents
  hooks.rs: Generate, validate and register Git hook adapters
  objects.rs: Stream the contents of many committed blobs through one Git process
  observation.rs: Observe branch and revision state
  repository.rs: The repository handle with its initialization, revision queries, paths, renames and diffs
  tree_entry.rs: A tree or index entry with its file kind and Git mode
directories:
  tests: Verify repository behavior, hook registration and real repository queries
