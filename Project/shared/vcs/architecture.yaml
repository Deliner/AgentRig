purpose: Provide Git repository observation, queries, exports, hook registration and controlled commands shared by features
type: flat
dependents: 13
files:
  mod.rs: Repository types, common Git operations and exports
  branches.rs: Validate base and feature prefix branch settings
  directories.rs: Discover maintained directories with Git ignore semantics
  export.rs: Export validated repository trees into isolated directories
  git.rs: Execute Git queries and decode repository contents
  hooks.rs: Generate, validate and register Git hook adapters
  observation.rs: Observe branch and revision state
directories:
  tests: Verify repository behavior, hook registration and real repository queries
