purpose: Provide Git repository observation and controlled changes for delivery workflows
files:
  architecture.yaml: Git capability inventory and public boundary
  mod.rs: Repository types, common Git operations and exports
  branches.rs: Validate branch settings and start feature branches
  directories.rs: Discover maintained directories with Git ignore semantics
  export.rs: Export validated repository trees into isolated directories
  git.rs: Execute Git queries and decode repository contents
  hooks.rs: Generate, validate and register Git hook adapters
  integration.rs: Apply feature integration and reference guards
  observation.rs: Observe branch and revision state
directories:
  tests: Verify repository behavior, hook registration and integration with real repositories
allow: []
deny: []
public: [mod.rs, tests/fixture.rs]
