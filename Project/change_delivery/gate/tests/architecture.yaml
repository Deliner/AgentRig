purpose: Verify working, staged and revision check selection and diagnostics
files:
  mod.rs: Declare the gate behavior tests and build a gated project with an oversized staged source
  outcomes.rs: Warning and blocking checks, actionable missing commands, targeted reruns and invalid selections
  selection.rs: Affected groups select commit and merge targets and record whether the full gate passed
  staged.rs: Staged checks use staged files and configuration, keep their logs and rerun after the export
  test_revision.py: Exact revision inputs, check evidence and invalid selection rejection
directories: {}
