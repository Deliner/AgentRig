purpose: Execute configured checks against working, staged or revision inputs and record their results
files:
  architecture.yaml: Verification gate responsibilities and dependency boundary
  mod.rs: Prepare checked snapshots, dispatch checks and produce actionable failures
  selection.rs: Map changed paths to configured affected check targets
  README.md: Gate inputs and affected-test selection guide
directories:
  tests: Verify check execution and source selection
allow:
  - Project/shared/testing/consumer.py
  - Project/shared/testing/repository.py
  - Project/project_config/mod.rs
  - Project/project_config/settings/mod.rs
  - Project/command_runner/mod.rs
  - Project/project_memory/evidence/mod.rs
  - Project/project_memory/mod.rs
  - Project/structural_lint/mod.rs
  - Project/structural_lint/config/mod.rs
  - Project/structural_lint/inventory/mod.rs
  - Project/shared/diagnostics/mod.rs
  - Project/shared/vcs/mod.rs
deny: []
public: [mod.rs]
