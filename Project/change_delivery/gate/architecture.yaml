purpose: Execute configured checks against working, staged or revision inputs and record their results through project_memory check evidence
type: flat
files:
  mod.rs: Prepare checked snapshots, select checks and record their outcomes
  check.rs: Run one configured check by its kind and produce actionable failures
  selection.rs: Map changed paths to configured affected check targets
  staged.rs: Give exported staged files reusable modification times and a dedicated cargo target
  README.md: Gate inputs and affected-test selection guide
directories:
  tests: Verify check execution and source selection
