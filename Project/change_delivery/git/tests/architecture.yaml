purpose: Verify Git feature delivery and transaction guards through the runtime process in installed projects
files:
  mod.rs: Install a project on its base branch and start, merge and read its features
  guards.rs: Commit and reference transaction guard verdicts
  integration.rs: Feature integration, rebase, conflicts and refusals that preserve branches
  cleanup.rs: Post-merge cleanup of owned runs and the scratch area
  push.rs: Pushes to a configured remote after commits and merges, and their failures
  start.rs: Feature start from a clean base and its refusals
directories: {}
