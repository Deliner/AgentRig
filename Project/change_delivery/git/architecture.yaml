purpose: Coordinate VCS feature branches, checked integration and commit guards
type: flat
files:
  mod.rs: Coordinate feature starts, checked branch integration and native transaction guards and offer the approval and consent functions
  integration.rs: Start feature branches and rebase and merge them onto the base after checks
  push.rs: Push the merged base and feature or a committed feature branch to the configured remote
  state.rs: Reject a feature commit with the empty State template, reset State after commits and commit it before merge
  approval.rs: Apply a proposal of protected enforcement files at the user's approval, record the approved content, a pin set under consent and new lint exceptions, and refuse a feature commit of unapproved content other than added lint rules or lowered baseline counts, an unapproved new exception or a backward pin
  exceptions.rs: Find the lint exceptions a content adds over the committed one, keyed by file, decision, rule and the line beneath
  proposal.rs: Locate the directory where proposed protected files wait for the user's approval
  pin.rs: Prepare a forward pin as a proposal with the source files it changes, and install a proposed pin before the user's approval writes it
  consent.rs: Record the user's standing consent for the open Plan items, pin a gated HEAD while it holds and list those pins
  compaction.rs: Record after a merge that the agent must compact its conversation, report whether that is due and lift it
  compaction.txt: Instruction to compact the conversation that a merge prints and the agent hook repeats
  sweep.rs: Remove after a merge the finished runs and every file Git ignores except the rig's working state, the pinned runtime and the kept paths, and report what was freed or could not be removed
directories:
  tests: Feature delivery and native or private transaction behavior scenarios
