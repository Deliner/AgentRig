purpose: Load the lint configuration, check it or evaluate its rules and the Clippy messages into lifted findings and count their errors
type: flat
files:
  mod.rs: Declarations of the evaluation parts and the location, modes, analysis and error count they offer
  location.rs: Lint location and the loading of its strict configuration with external repair guidance
  analysis.rs: Lint modes, the analysis of the configuration or of the sources and the Clippy run into findings and the count of their errors
  evaluation.rs: Evaluate configured rules into scalar, syntax and architecture findings, reporting a classification only where it repeats an earlier one
  file_measures.rs: Measure a file for the structural rules from its text, path, directory entries or the first file of its rule, and analyze the selected source files for the syntax rules on the available threads
  foreign_code.rs: Tell the analysis of a source file which code lies outside the project, from the external crates the directory-architecture settings declare
  findings.rs: Build the finding of a rule for a measured value from its level or thresholds, the syntax and mixed-junction findings and the finding of a Clippy message
  lifting.rs: Lift a finding under an exception naming its rule and report each exception that lifts none
directories:
  tests: Verify configured rules evaluated over source trees and the lifting of findings under exceptions
