purpose: Detect Rust operators and standard library calls whose behavior differs from what the form appears to state, where a direct standard form states the intent
type: flat
files:
  mod.rs: Dispatch comparisons and calls to the standard-form detectors and report each form outside test code lacking a reference on the line above
  call_syntax.rs: Read the method name and receiver of a call and its sole argument, and find a call inside a node
  superseded_form.rs: Rust forms the rig's toolchain replaces directly, a strip_prefix or strip_suffix falling back to its receiver, an Infallible type and a Vec collected from a map over 0..n, lacking a reference on the line above
  epsilon_tolerance.rs: Rust comparison whose operand is f32::EPSILON or f64::EPSILON, an absolute tolerance that does not scale with the compared values
  max_fallback.rs: Rust addition or multiplication with an operand that falls back to MAX through unwrap_or, which overflows or no longer means the bound
  dotted_extension.rs: Rust with_extension or set_extension given a string literal that starts with a dot, which doubles the dot
  indexed_array.rs: Rust array literal with a call among its elements indexed by a computed value, which evaluates every element to keep one, in product and test code, lacking a reference on the line above
  flag_filter.rs: Rust filter on a value computed by a call through a closure that ignores the value and computes nothing, which keeps or drops the whole result by a flag known before the call, in product and test code, lacking a reference on the line above
