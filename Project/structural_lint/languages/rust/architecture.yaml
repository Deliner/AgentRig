purpose: Measure Rust conditions, function lengths, parameters, comments and the Rust-only source rules
files:
  mod.rs: Rust syntax dispatch, conditions, function lengths, parameters, comments, string literal spans, assertions, discarded results and spawn handles, and macro bodies
  blocking_async.rs: Rust thread::sleep, block_on or not awaited std fs or std net socket call inside an async fn or async block with no closure or plain fn in between, lacking a reference on the line above
  super_reach.rs: Rust path reaching two module levels up through super::super in a use declaration, an expression or a type
  suppression.rs: Rust allow, expect and ignore attributes, direct or as a cfg_attr argument, and a let _ binding of a variable that silences its unused warning, lacking a reference on the line above
  panic_surface.rs: Rust panic surface lacking a reference on the line above or a referenced Clippy allow, an unwrap, expect, resume_unwind or panic macro in source, macro arguments or macro_rules! bodies, and a catch_unwind call or AssertUnwindSafe wrapper
  naming.rs: Rust values tied to their slot by position instead of a name, a format string with two or more unnamed placeholders and a struct literal field set from another field's name
  shell_command.rs: Rust shell launch whose command flag is followed by a value that is neither a literal nor a constant, so the value is parsed as shell code, lacking a reference on the line above
directories:
  exemptions: Classify where a Rust node sits, test-only, debug-only or async code, for the exemptions and scope of every Rust detector
  control_flow: Detect Rust control flow whose shape hides which loop it leaves, which case it handles or whether the length suffices
  errors: Detect Rust code where an error disappears without a trace instead of being handled or propagated
  ownership: Detect Rust resources, locks, process-global state and wrapped values whose lifetime or access bypasses an owner
  signature: Detect Rust signatures, type shapes and trait implementations that misstate what a type or function promises
  std_forms: Detect Rust operators and standard library calls whose behavior differs from what the form appears to state, where a direct standard form states the intent
  test_code: Detect Rust test code placed outside the test locations, tests that pass without checking the product and tests that share a fixed port or path
  unsafe_code: Detect Rust unsafe surface lacking a recorded justification and unsafe operations whose safety the compiler no longer checks
