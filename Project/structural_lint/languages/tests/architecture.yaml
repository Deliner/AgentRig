purpose: Verify language-specific measurements from native analysis
files:
  mod.rs: Comment, boolean parameter, credential and string literal span measurements, and the symbol and line readers the declaration and control-flow threshold tests share, from native analysis
  declarations.rs: Rust and Python parameter count and function line measurements of declarations from native analysis
  markers.rs: Disabled-test, allow/expect/cfg_attr suppression and debug-artifact marker measurements from native analysis
  async_code.rs: Rust std lock guards held or released across a later .await and blocking sleep or block_on calls inside or outside async code, from native analysis
  panic_surface.rs: Rust debug-only assert, unwrap_err, expect_err and resume_unwind, panics inside macro_rules! bodies, panics covered by a Clippy allow or expect on an enclosing item, and catch_unwind or AssertUnwindSafe measurements from native analysis
  unsafe_site.rs: Rust unsafe block, function, impl, trait, static mut and macro-body unsafe token measurements, including items behind attributes, from native analysis
  shell_command.rs: Rust shell launches whose command flag is followed by data in the argument chain, with literal and constant commands, other flags, programs, order and test-only launches skipped, from native analysis
directories:
  configuration: Verify measurements of TOML and YAML configuration documents from native analysis
  control_flow: Verify Rust control-flow measurements, and nesting depth, branch budget, boolean expression operands and mixed boolean junctions in Rust and Python, from native analysis
  errors: Verify measurements of code where an error disappears without a trace, from native analysis
  ownership: Verify Rust resource, lock, process-global state, wrapper and paired-call measurements from native analysis
  reference: Verify Rust measurements of how code reaches a name, a module path or a value slot, from native analysis
  signature: Verify Rust function signature, type shape, trait implementation and conversion measurements from native analysis
  std_forms: Verify Rust measurements of operators and standard library calls whose behavior differs from what the form appears to state, from native analysis
  test_code: Verify Rust measurements of test modules outside the test locations, tests that pass on any panic, items no test build compiles and tests that bind a fixed port, from native analysis
