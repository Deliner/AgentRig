purpose: Verify language-specific measurements from native analysis
files:
  mod.rs: Comment, control-flow, boolean-expression, signature, credential and string literal span measurements from native analysis
  declarations.rs: Rust and Python parameter count and function line measurements of declarations from native analysis
  async_code.rs: Rust std lock guards held or released across a later .await and blocking sleep, block_on, std fs and std net calls inside or outside async code, from native analysis
  panic_surface.rs: Rust debug-only assert, unwrap_err, expect_err and resume_unwind, panics inside macro_rules! bodies, panics covered by a referenced Clippy allow on an enclosing item, and unjustified catch_unwind or AssertUnwindSafe measurements from native analysis
  shell_command.rs: Rust shell launches whose command flag is followed by data in the argument chain, with literal and constant commands, other flags, programs, order, justified and test-only launches skipped, from native analysis
directories:
  control_flow: Verify Rust control-flow measurements and mixed boolean junctions in Rust and Python from native analysis
  errors: Verify measurements of code where an error disappears without a trace, from native analysis
  markers: Verify measurements of markers that disable a test or silence a rule or a warning, from native analysis
  ownership: Verify Rust resource, lock, process-global state, wrapper and paired-call measurements from native analysis
  reference: Verify Rust measurements of how code reaches a name, a module path or a value slot, from native analysis
  signature: Verify Rust function signature, type shape, trait implementation and conversion measurements from native analysis
  std_forms: Verify Rust measurements of operators and standard library calls whose behavior differs from what the form appears to state, from native analysis
  test_code: Verify Rust measurements of test modules outside the test locations, tests that pass on any panic or without a check and tests that share a fixed port or path, from native analysis
  unsafe_code: Verify Rust measurements of unsafe surface lacking a recorded justification and unsafe operations the compiler no longer checks, from native analysis
