purpose: Verify language-specific measurements and enforcement through real lint consumers
files:
  test_language.py: Rust and Python condition, function and parameter measurement scenarios
  test_language_delivery.py: Configured enforcement and repair guidance for language measurements
  mod.rs: Comment, control-flow, signature, credential and silent-error measurements from native analysis
  markers.rs: Disabled-test, allow/expect/cfg_attr suppression and debug-artifact marker measurements from native analysis
  global_state.rs: Static lock and public static cell measurements, direct and inside lazy_static!/thread_local!, from native analysis
  silent_error.rs: Rust collapsed read_dir chain and verdict-answering Err arm measurements from native analysis
  manifest.rs: TOML lint-table allow-level measurements and syntax-error location from native analysis
  async_code.rs: Rust std lock guards held or released across a later .await and blocking sleep or block_on calls inside or outside async code, from native analysis
  panic_surface.rs: Rust debug-only assert, unwrap_err, expect_err and resume_unwind, and unjustified catch_unwind or AssertUnwindSafe measurements from native analysis
  recursive_deletion.rs: Rust remove_dir_all call measurements by path, bare name, method and macro body from native analysis
  super_reach.rs: Rust super::super path measurements in use declarations, expressions and types from native analysis
  tuple_as_record.rs: Rust signature tuple measurements, top-level and nested in generic or slice types, from native analysis
  unsafe_site.rs: Rust unsafe block, function, impl, trait, static mut and macro-body unsafe token measurements, justified across attributes, from native analysis
directories: {}
