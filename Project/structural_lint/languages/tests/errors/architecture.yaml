  collapsed_chain.rs: Rust collapsed read_dir chains, Ok-only filter_map or flat_map with lines spellings left to Clippy, and ok().flatten() or join fallbacks
  error_verdict.rs: Rust Err arms answering a verdict in a function returning Result<bool>, and the propagating, guarded, aliased, deferred or test arms kept
  process_success.rs: Rust process success answering a verdict without reading the exit code, and the coded, unlaunched, argued, deferred or test checks kept
