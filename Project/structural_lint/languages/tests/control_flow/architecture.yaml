purpose: Verify Rust control-flow measurements and mixed boolean junctions in Rust and Python from native analysis
files:
  mod.rs: Rust unlabeled exits of nested loops and subtractions from a length or count call from native analysis
  mixed_junction.rs: Rust and Python outermost boolean expressions joining conjunctions with disjunctions directly or inside parentheses, and negated or separate expressions skipped, from native analysis
  hidden_exit.rs: Rust macro_rules! transcribers that return, propagate with ? or leave the caller loop, with exit-named macros, own loops, closures, async blocks, nested functions, unparsed, justified and test-only transcribers skipped, from native analysis
  range_chain.rs: Rust if-else chains and match guards splitting one value by literal bounds, with mixed subjects, named limits, justified and test-only chains skipped, from native analysis
  stale_check.rs: Rust exists, is_file and is_dir checks in an if condition or a tested let, followed by a propagated filesystem action on the same path in the presence branch or after a skipping absence branch, with failing absence branches, unguarded, unpropagated, independent, other-path, justified and test-only checks skipped, from native analysis
  variant_equality.rs: Rust equality with an enum variant path and matches! naming a variant, with constants, calls, literal patterns, justified and test-only sites skipped, from native analysis
directories: {}
