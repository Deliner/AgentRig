purpose: Verify Rust function signature, type shape, trait implementation and conversion measurements from native analysis
files:
  mod.rs: Declare the signature measurement test modules and filter native measurements of one kind
  constant_default.rs: Rust trait default methods whose body ignores self, with empty, receiving, required, justified and test-only methods skipped, from native analysis
  derived_trait.rs: Rust derived Debug printing secret-named string and byte fields, and derived Deserialize beside a same-file constructor that refuses a stored parameter, with their exemptions, from native analysis
  implicit_order.rs: Rust enums deriving PartialOrd or Ord whose variants order by declaration, directly or inside cfg_attr, and pinned, single-variant, unordered, justified or test-only enums, from native analysis
  ord_equality.rs: Rust manual order and equality reading different fields, and consistent, justified or unresolvable comparisons, from native analysis
  partial_impl.rs: Rust PartialEq, Hash, PartialOrd, Ord and Clone impls reading self fields without naming every field, and exhaustive, other-trait, justified or test-only impls, from native analysis
  same_type.rs: Rust functions with two parameters of one type and tuple structs or variants with two positions of one type or a bool among two or more positions, with receivers, trait impls, justified and test-only items skipped, from native analysis
  tuple_as_record.rs: Rust signature tuple measurements, top-level and nested in generic or slice types, from native analysis
  untyped_conversion.rs: Rust untyped lets over parse, sum, collect, into, try_into, product, Default::default and From::from, with typed, turbofish, argument, pattern, Into-bounded parameter, justified and test-only lets skipped, and conversion trait paths whose target type the statement does not name, with typed, owned, turbofish, other-owner, foreign, justified and test-only paths skipped, from native analysis
  type_shape.rs: Rust aliases of a scalar or String, an Option over a bool, and an Option over another Option only where Clippy does not check it and no implemented trait sets it, with generic, other and justified types skipped, from native analysis
