purpose: Measure scalar rules in supported source languages through registered syntax handlers
files:
  manifest.rs: TOML manifest lint tables, a lint set to allow under lints or workspace.lints without a reference above
  mod.rs: Scalar measurement traversal of a parsed source with located results
  registry.rs: Rule and measurement capabilities exposed for supported extensions
  python.rs: Python conditions, boolean expressions, function lengths, parameters and comments
directories:
  neutral_metrics: Located measurement record and the condition, boolean expression, comment, credential, function, nesting, parameter and branch measurements shared by syntax handlers
  rust: Measure Rust conditions, function lengths, parameters, comments and the Rust-only source rules
  tests: Verify language measurements and delivery enforcement
