purpose: Execute architecture analysis over configured scope and convert measured contract findings into lint diagnostics
files:
  architecture.yaml: Architecture execution responsibilities and dependency boundary
  mod.rs: Coordinate inventory validation, dependency analysis and diagnostic conversion
  scope.rs: Select directories and source files while preserving complete responsibility inventories
  analysis.rs: Read sources, build language resolvers and link local crate dependencies
directories: {}
allow:
  - Project/structural_lint/architecture/mod.rs
  - Project/structural_lint/architecture/resolution/mod.rs
  - Project/structural_lint/architecture/resolution/javascript/mod.rs
  - Project/structural_lint/architecture/resolution/python/mod.rs
  - Project/structural_lint/architecture/resolution/rust/mod.rs
  - Project/structural_lint/architecture/source/mod.rs
  - Project/structural_lint/config/mod.rs
  - Project/structural_lint/inventory/mod.rs
  - Project/structural_lint/selection/mod.rs
  - Project/shared/diagnostics/lint.rs
deny: []
public: [mod.rs]
