purpose: Validate directory responsibilities and enforce boundaries and cycles over resolved source dependencies
files:
  architecture.yaml: Architecture analysis responsibilities and dependency boundary
  mod.rs: Resolved dependency and issue records with contract-check composition
  policy.rs: Strict directory contracts and enclosing allow, deny and public boundaries
  inventory.rs: Exact file and child-directory responsibility coverage checks
  graph.rs: Cycle detection over measured directory dependencies
  tests.rs: Contract validation, boundary enforcement and measured cycle behavior
  README.md: Rule configuration, contract format and source analysis limits
directories:
  tests: Exercise architecture inventories and boundaries through four-language CLI consumers
  resolution: Resolve extracted references to concrete project source files
  runner: Combine configured scope, extraction, resolution and actionable findings
  source: Extract located dependency references from supported syntax
allow:
  - Project/structural_lint/testing/consumer.py
  - Project/structural_lint/catalog/mod.rs
  - Project/structural_lint/config/mod.rs
  - Project/structural_lint/inventory/mod.rs
  - Project/structural_lint/selection/mod.rs
  - Project/structural_lint/rules/architecture.rs
  - Project/structural_lint/rules/kind.rs
  - Project/structural_lint/languages/mod.rs
  - Project/structural_lint/languages/registry.rs
  - Project/shared/diagnostics/lint.rs
  - Project/shared/yaml/mod.rs
deny: []
public: [mod.rs, runner/mod.rs, source/mod.rs]
