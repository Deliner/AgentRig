purpose: Verify directory architecture findings by linting Rust and Python consumer projects in process
files:
  mod.rs: Consumer projects with directory contracts, in-process lint and compiler checks of Rust samples
  cli.rs: Findings of both lint binaries, warning level without mutation, rule discovery, explanation and escaping links
  coupling.rs: Dependents budgets with their edges, lint-edges, test-only uses and file fan-out budgets
  disallowed.rs: Disallowed paths and propagated method calls outside allowed files, and invalid policy entries
  externals.rs: Declared external dependencies that the selected sources never name
  incomplete.rs: Unresolved imports, unanalyzed loaders and attributes, and incomplete analysis beside declared externals
  inventory.rs: Exact file and directory inventories of source-free trees, empty directories and exclusions
  settings.rs: Invalid architecture settings and crate roots required by enabled Rust rules
  versioned.rs: Git working-directory inventories of both lint binaries, ignored trees and empty directories
directories:
  rust_resolution: Verify how Rust attributes, bindings, macros, module wiring, local crates and embedded resources become directory edges or incomplete analysis
