purpose: Verify composed lint CLI diagnostics and portable consumer behavior
files:
  consumer.rs: Seed a consumer with the size rule and read its lint and configuration check findings
  configuration.rs: Invalid rule, selector, language and setting scenarios of configuration check
  discovery.rs: Rule catalog, examples that pass configuration check and invalid discovery arguments
  diagnostics.rs: Threshold, override, invalid configuration and staged snapshot diagnostics
  explain.rs: Effective selection explanations and diagnostic consistency
  tree.rs: Directory tree output, ordering, exclusions and rejected paths
  languages.rs: Rust and Python branch conditions, comment references, syntax errors, language selection and defaults, condition policies and single junctions through lint
  baseline.rs: Recorded error baseline, ratchet failures on growth and lowering-only updates
  portable.rs: Standalone and embedded linter portability scenarios and their shared Git tracked and untracked inventory
  mod.rs: Line-width and forbidden-file findings from native evaluation
directories:
  architecture: Directory architecture findings for Rust and Python consumer projects
