purpose: Show directory structure as a tree of names and score how clearly the names of a Rust tree show its code
type: flat
files:
  mod.rs: Ordered structure score report over the code and contract texts of a Rust tree
  tree.rs: Render directories as a box-drawing tree of names
  corpus.rs: Corpus of production Rust files with code words, documentation summaries and architecture descriptions
  words.rs: Split identifiers and text into words and reduce each word to a stem
  clusters.rs: Count clusters of top-level items joined by name references inside one file
  units.rs: Directory and file units of the measured tree with entries, code words, word weights and descriptions
  scores.rs: Per-unit problem scores with the edit kind and the evidence behind each