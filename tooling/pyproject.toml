[project]
name = "agentrig-tooling"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pyyaml>=6.0.3",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12.20260906",
  "typos>=1.35,<2",
  "vulture>=2.14,<3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "PERF", "S", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["Project"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "S603", "S607"]
"**/testing/**/*.py" = ["S101", "S603", "S607"]
"**/conftest.py" = ["S101", "S603", "S607"]

[tool.typos.default.extend-words]
numer = "numer"

[tool.mypy]
strict = true
explicit_package_bases = true
cache_dir = "../.cache/mypy"

[tool.pytest.ini_options]
cache_dir = "../.cache/pytest"
pythonpath = [".."]
norecursedirs = [".cache", "runtime"]
