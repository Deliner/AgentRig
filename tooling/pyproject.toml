[project]
name = "discipline-worker-tooling"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "typos>=1.35,<2",
  "vulture>=2.14,<3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.mypy]
strict = true
cache_dir = "../.cache/mypy"

[tool.pytest.ini_options]
cache_dir = "../.cache/pytest"
pythonpath = [".", "../.codex/hooks"]
norecursedirs = [".cache", "runtime"]
