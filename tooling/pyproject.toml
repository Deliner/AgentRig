[project]
name = "agentrig-tooling"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "typos>=1.35,<2",
  "vulture>=2.14,<3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "PERF", "S", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["Project"]

[tool.ruff.lint.per-file-ignores]
"**/testing/**/*.py" = ["S101", "S603", "S607"]

# DECISION: D112
[tool.typos.files]
extend-exclude = ["Project/shared/syntax/tree-sitter-rust/"]

[tool.typos.default]
extend-ignore-identifiers-re = ["^[0-9a-f]*[0-9][0-9a-f]*$"]

[tool.typos.default.extend-words]
numer = "numer"
ment = "ment"

[tool.mypy]
strict = true
explicit_package_bases = true
cache_dir = "../.cache/mypy"
