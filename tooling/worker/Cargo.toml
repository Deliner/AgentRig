[package]
name = "discipline-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
globset = "0.4"
sha2 = "0.10"
fs2 = "0.4"
tempfile = "3"
shell-words = "1"
anyhow = "1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
signal-hook = "0.3"
libc = "0.2"
