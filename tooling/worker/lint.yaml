    - tooling/worker/review/src/response/tests.rs
    - tooling/worker/review/src/snapshot/tests.rs
    - tooling/worker/review/src/snapshot/native_tests.rs
    - tooling/worker/review/src/snapshot/external_tests.rs
    - tooling/worker/review/src/mcp/tests.rs
    - tooling/worker/review/src/execution/tests/broker.rs
    - tooling/worker/review/src/execution/tests/harness.rs
    - tooling/worker/review/src/run/tests/execution.rs
    - tooling/worker/review/src/vcs/tests/external_vcs.rs
    - tooling/worker/review/src/vcs/tests/private_integration.rs
    - tooling/worker/review/src/vcs/tests/registration.rs
    - tooling/worker/review/src/vcs/tests/vcs.rs
    python_root: .
  error_skill: .agents/skills/refactor-large-directory/SKILL.md
  extensions:
  - .rs
  - .py
  - .pyi
  - .js
  - .jsx
  - .mjs
  - .cjs
  - .ts
  - .tsx
  - .mts
  - .cts
  id: architecture
  include:
  - .
  - '**'
  kind: directory-architecture
  level: error
  target: directory
  warning_skill: .agents/skills/refactor-large-directory/SKILL.md
  exclude:
  - .tmp
  - .tmp/**
  - .mypy_cache
  - .mypy_cache/**
  - .pytest_cache
  - .pytest_cache/**
  - .ruff_cache
  - .ruff_cache/**
  - tooling/worker/review/runtime
  - tooling/worker/review/runtime/**
  - tooling/worker/review/reports
  - tooling/worker/review/reports/**
