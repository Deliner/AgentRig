      - re
      - select
      - shlex
      - shutil
      - signal
      - statistics
      - subprocess
      - sys
      - tarfile
      - tempfile
      - time
      - tomllib
      - typing
      - yaml
    rust_crates:
      agentrig: tooling/worker/src/lib.rs
