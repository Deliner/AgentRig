      - serde_yaml_ng
      - sha2
      - shell_words
      - signal_hook
      - std
      - tempfile
      - toml
      - toml_edit
      - tree_sitter
      - tree_sitter_bash
      - tree_sitter_javascript
      - tree_sitter_python
      - tree_sitter_rust
      - tree_sitter_typescript
      - yaml_rust2
      python:
      - __future__
      - argparse
      - collections
      - contextlib
      - copy
      - dataclasses
      - datetime
      - hashlib
      - io
      - itertools
      - json
      - os
