    rust_roots:
    - tooling/worker/examples/rust/crates/engine/src/lib.rs
    - tooling/worker/src/lib.rs
    - tooling/worker/src/main.rs
    - tooling/worker/src/lint/standalone.rs
    - tooling/worker/review/src/lib.rs
    - tooling/worker/review/src/main.rs
