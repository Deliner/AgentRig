schema_version: 1
runner:
  runtime_root: ../runtime
  report_root: ../reports
  isolation: bubblewrap
  parallelism: 3
  timeout_seconds: 900
  format_attempts: 3
reviewers:
  requirements:
    frontend: codex
    model: gpt-5.6-luna
    reasoning_effort: high
    prompt: ../prompts/requirements.md
  methodology:
    frontend: codex
    model: gpt-5.6-luna
    reasoning_effort: high
    prompt: ../prompts/methodology.md
  correctness:
    frontend: codex
    model: gpt-5.6-sol
    reasoning_effort: high
    prompt: ../prompts/correctness.md
tools:
  review_research:
    description: Review research requirements and methodology
    reviewers:
    - requirements
    - methodology
    project_config: projects/research.yaml
  review_code:
    description: Review code requirements, correctness and tests
    reviewers:
    - requirements
    - correctness
    project_config: projects/code.yaml
