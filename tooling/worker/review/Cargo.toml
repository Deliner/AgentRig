[package]
name = "review-runner"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Deliner/AgentRig"
description = "Isolated configurable review runner shipped with AgentRig"

[[test]]
name = "configuration"
path = "src/config/tests.rs"

[[test]]
name = "yaml"
path = "src/config/yaml_tests.rs"

[[test]]
name = "validation"
path = "src/response/tests.rs"

[[test]]
name = "snapshot"
path = "src/snapshot/tests.rs"

[[test]]
name = "broker"
path = "src/execution/tests/broker.rs"

[[test]]
name = "harness"
path = "src/execution/tests/harness.rs"

[[test]]
name = "execution"
path = "src/run/tests/execution.rs"

[[test]]
name = "continuation"
path = "src/run/tests/continuation.rs"

[[test]]
name = "external_vcs"
path = "src/vcs/tests/external_vcs.rs"

[[test]]
name = "private_integration"
path = "src/vcs/tests/private_integration.rs"

[[test]]
name = "registration"
path = "src/vcs/tests/registration.rs"

[[test]]
name = "vcs"
path = "src/vcs/tests/vcs.rs"

[[test]]
name = "mcp"
path = "src/mcp/tests.rs"

[[test]]
name = "snapshot_native"
path = "src/snapshot/native_tests.rs"

[[test]]
name = "snapshot_external"
path = "src/snapshot/external_tests.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
serde_path_to_error = "0.1"
yaml-rust2 = { version = "0.11", default-features = false }
sha2 = "0.10"
globset = "0.4"
tempfile = "3"
libc = "0.2"
shell-words = "1"
jsonschema = { version = "0.33", default-features = false }
