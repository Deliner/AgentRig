[package]
name = "review-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
serde_path_to_error = "0.1"
yaml-rust2 = { version = "0.11", default-features = false }
toml = "1"
sha2 = "0.10"
globset = "0.4"
tempfile = "3"
libc = "0.2"
jsonschema = { version = "0.33", default-features = false }
