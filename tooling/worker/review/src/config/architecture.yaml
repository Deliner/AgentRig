purpose: Define and validate review configuration with strict YAML and explicit credential references
files:
  architecture.yaml: Configuration responsibilities and public boundary
  mod.rs: Review configuration schema, resource resolution and validation
  credentials.rs: Credential reference schema and harness-specific validation
  yaml.rs: Strict YAML decoding, encoding and actionable schema errors
  tests.rs: Configuration loading and invalid input behavior tests
  yaml_tests.rs: YAML syntax, scalar typing and file error behavior tests
directories: {}
allow:
  - tooling/worker/review/src/response/contract.rs
  - tooling/worker/review/src/vcs/mod.rs
deny: []
public: [mod.rs, credentials.rs, yaml.rs]
