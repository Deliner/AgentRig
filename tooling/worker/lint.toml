# Every rule declares supported target, selectors, thresholds, and repair skills.
version = 1
config_skill = ".agents/skills/configure-linter/SKILL.md"
exclude = [".git", ".git/**", ".cache", ".cache/**", "**/__pycache__", "**/__pycache__/**", "**/.venv", "**/.venv/**", "**/target", "**/target/**"]

[[rules]]
id = "file-size"
kind = "nonblank-lines"
target = "file"
include = ["**"]
extensions = [".py", ".sh", ".rs", ".js", ".ts", ".tsx", ".jsx", ".go", ".c", ".h", ".cpp", ".cs", ".java", ".json", ".md", ".toml", ".txt", ".yaml", ".yml"]
warning = 300
error = 500
warning_skill = ".agents/skills/refactor-large-file/SKILL.md"
error_skill = ".agents/skills/refactor-large-file/SKILL.md"

[[rules]]
id = "directory-size"
kind = "directory-entries"
target = "directory"
include = ["**"]
exclude = ["Ledger/Decisions", "Ledger/Invariants"]
warning = 10
error = 15
warning_skill = ".agents/skills/refactor-large-directory/SKILL.md"
error_skill = ".agents/skills/refactor-large-directory/SKILL.md"

# Repair guidance for each external stage of the same mandatory gate.
# Language rules start as warnings across the existing harness.
# Use level = "error" for named conditions; add error = N to numeric rules to block.

[[rules]]
id = "named-if-condition"
kind = "named-if-condition"
target = "file"
include = ["**"]
extensions = [".rs", ".py", ".pyi"]
level = "warning"
warning_skill = ".agents/skills/name-if-condition/SKILL.md"
error_skill = ".agents/skills/name-if-condition/SKILL.md"

[[rules]]
id = "function-lines"
kind = "function-lines"
target = "file"
include = ["**"]
extensions = [".rs", ".py", ".pyi"]
warning = 40
warning_skill = ".agents/skills/refactor-long-function/SKILL.md"
error_skill = ".agents/skills/refactor-long-function/SKILL.md"

[[rules]]
id = "parameter-count"
kind = "parameter-count"
target = "file"
include = ["**"]
extensions = [".rs", ".py", ".pyi"]
warning = 4
warning_skill = ".agents/skills/reduce-parameters/SKILL.md"
error_skill = ".agents/skills/reduce-parameters/SKILL.md"

[gate_skills]
repo-policy = ".agents/skills/repair-verification/SKILL.md"
command-policy = ".agents/skills/repair-verification/SKILL.md"
ruff-format = ".agents/skills/repair-verification/SKILL.md"
ruff = ".agents/skills/repair-verification/SKILL.md"
mypy = ".agents/skills/repair-verification/SKILL.md"
pytest = ".agents/skills/repair-verification/SKILL.md"
typos = ".agents/skills/repair-verification/SKILL.md"
vulture = ".agents/skills/repair-verification/SKILL.md"
rustfmt = ".agents/skills/repair-verification/SKILL.md"
clippy = ".agents/skills/repair-verification/SKILL.md"
