purpose: Compose portable AgentRig binaries with their resources, examples and user documentation
files:
  architecture.yaml: Worker package inventory and capability composition
  Cargo.toml: Worker library and executable build declarations
  Cargo.lock: Locked Rust dependency versions
  README.md: Worker commands and lint rule user guide
  build: Build the candidate worker for development verification
  run: Dispatch commands to the pinned installed runtime
  rust-toolchain.toml: Rust toolchain selected for reproducible development
directories:
  assets: Canonical resources embedded in installed environments
  examples: Independent consumer projects and portable usage demonstrations
  src: AgentRig library, executable entry points and feature implementations
allow: []
deny: []
public: [src/lib.rs]
