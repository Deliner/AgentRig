  mod.rs: Shared parsing and scalar measurement traversal with located results
  registry.rs: Grammar and measurement capabilities exposed for supported extensions
  python.rs: Python conditions, function lengths, parameters and comments
  rust.rs: Rust conditions, function lengths, parameters and comments
directories:
  tests: Verify language measurements and delivery enforcement
allow:
  - tooling/worker/src/lint/testing/consumer.py
  - tooling/worker/src/lint/rules/kind.rs
deny: []
public: [mod.rs, registry.rs]
