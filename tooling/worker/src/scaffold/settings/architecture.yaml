purpose: Define and validate project settings independently of loading recovery state or executing workflows
files:
  architecture.yaml: Settings responsibilities and shared schema boundary
  mod.rs: Strict project schema, version constants, YAML reading and project-relative paths
  capabilities.rs: Enabled capability declarations and their resource validation
  client.rs: Agent model, reasoning and API reference settings
  validation.rs: Structural validation of paths, commands, checks, hooks and oracles
directories: {}
allow:
  - tooling/worker/src/environment/mod.rs
  - tooling/worker/src/jobs/mod.rs
  - tooling/worker/src/paths/mod.rs
  - tooling/worker/src/lint/config/mod.rs
  - tooling/worker/src/delegate/config/mod.rs
  - tooling/worker/review/src/config/mod.rs
  - tooling/worker/review/src/config/yaml.rs
  - tooling/worker/review/src/config/credentials.rs
  - tooling/worker/review/src/vcs/mod.rs
deny: []
public: [mod.rs, capabilities.rs, client.rs]
