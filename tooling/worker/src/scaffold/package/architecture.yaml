purpose: Generate agent environment resources and inspect their installed configuration and runtime readiness
files:
  architecture.yaml: Package generation, readiness and installation feature boundaries
  mod.rs: Generate the environment bundle and read prepared or installed resource contents
  adapters.rs: Generate Git and agent hook adapters
  assets.rs: Ship canonical skills and scaffold memory and agent instructions
  claude.rs: Generate, merge and inspect Claude Code client settings
  doctor.rs: Check installed runtime, hooks, tools and client readiness
  lint.rs: Generate supported lint rule examples for the consumer
  template.rs: Interpret scaffold options and generate project configuration and command adapters
directories:
  tests: Verify generated lint policy and runtime readiness
  setup: Initialize the configured environment without overwriting consumer files
allow:
  - tooling/worker/src/scaffold/testing/consumer.py
  - tooling/worker/src/scaffold/config/mod.rs
  - tooling/worker/src/scaffold/settings/mod.rs
  - tooling/worker/src/arguments/mod.rs
  - tooling/worker/src/paths/mod.rs
  - tooling/worker/src/lint/config/mod.rs
  - tooling/worker/src/yaml/mod.rs
  - tooling/worker/src/vcs/mod.rs
  - tooling/worker/src/scaffold/memory/format.rs
  - tooling/worker/src/jobs/mod.rs
  - tooling/worker/src/diagnostics/mod.rs
  - tooling/worker/src/lint/rules.rs
  - tooling/worker/src/lint/rules/kind.rs
  - tooling/worker/assets/skills/**
deny: []
public: [mod.rs, adapters.rs, doctor.rs, setup/mod.rs, setup/init.rs]
