purpose: Generate agent environment resources and inspect their installed configuration and runtime readiness
files:
  architecture.yaml: Package generation, readiness and installation feature boundaries
  mod.rs: Generate the environment bundle and read prepared or installed resource contents
  adapters.rs: Generate VCS and agent hook adapters and MCP registrations
  assets.rs: Ship canonical skills and scaffold memory and agent instructions
  claude.rs: Generate, merge and inspect Claude Code client settings
  doctor.rs: Check installed runtime, hooks, tools and client readiness
  executors.rs: Identify configured review and delegation executors
  lint.rs: Generate supported lint rule examples for the consumer
  manifest.rs: Generate installation receipts and interpret approved local resource overrides
  review.rs: Bundle review contracts, prompts and project configurations
  template.rs: Interpret scaffold options and generate project configuration and command adapters
directories:
  setup: Initialize, preview and install the configured environment while preserving consumer changes
allow:
  - tooling/worker/review/testing/consumer.py
  - tooling/worker/src/scaffold/testing/consumer.py
  - tooling/worker/src/scaffold/config/mod.rs
  - tooling/worker/src/scaffold/settings/mod.rs
  - tooling/worker/src/scaffold/receipt/mod.rs
  - tooling/worker/src/scaffold/installation/mod.rs
  - tooling/worker/src/scaffold/recovery/mod.rs
  - tooling/worker/src/arguments/mod.rs
  - tooling/worker/src/paths/mod.rs
  - tooling/worker/src/composition/mod.rs
  - tooling/worker/src/resources/mod.rs
  - tooling/worker/src/environment/mod.rs
  - tooling/worker/src/environment/hooks.rs
  - tooling/worker/src/delegate/config/mod.rs
  - tooling/worker/src/lint/config/mod.rs
  - tooling/worker/review/src/config/mod.rs
  - tooling/worker/review/src/config/yaml.rs
  - tooling/worker/review/src/vcs/mod.rs
  - tooling/worker/src/scaffold/memory/format.rs
  - tooling/worker/src/jobs/mod.rs
  - tooling/worker/src/diagnostics/mod.rs
  - tooling/worker/src/lint/rules.rs
  - tooling/worker/src/lint/rules/kind.rs
  - tooling/worker/assets/skills/**
  - tooling/worker/review/config/**
  - tooling/worker/review/prompts/**
  - tooling/worker/review/src/execution/sandbox/mod.rs
deny: []
public: [mod.rs, adapters.rs, manifest.rs, doctor.rs, setup/mod.rs, setup/init.rs, setup/registration.rs]
