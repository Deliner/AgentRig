# Project subtree inventory; dependency extensions do not limit file coverage.
- architecture:
    external:
      rust:
      - alloc
      - anyhow
      - core
      - fs2
      - globset
      - libc
      - serde
      - serde_json
      - serde_path_to_error
      - serde_yaml_ng
      - sha2
      - shell_words
      - signal_hook
      - std
      - tempfile
      - toml
      - tree_sitter
      - tree_sitter_bash
      - tree_sitter_python
      - tree_sitter_rust
      - yaml_rust2
      python:
      - __future__
      - argparse
      - collections
      - dataclasses
      - datetime
      - itertools
      - json
      - os
      - pathlib
      - platform
      - pytest
      - select
      - shlex
      - shutil
      - signal
      - statistics
      - subprocess
      - sys
      - tempfile
      - time
      - typing
      - yaml
    rust_crates:
      agentrig: Project/lib.rs
    rust_roots:
    - Project/shared/testing/examples/rust/crates/engine/src/lib.rs
    - Project/lib.rs
    - Project/command_line/main.rs
    - Project/structural_lint/standalone.rs
    python_root: .
    feature_root: Project
  error_skill: .agents/skills/refactor-large-directory/SKILL.md
  extensions:
  - .rs
  - .py
  - .pyi
  id: architecture
  include:
  - Project
  - 'Project/**'
  kind: directory-architecture
  level: error
  target: directory
  warning_skill: .agents/skills/refactor-large-directory/SKILL.md
