# Every rule declares supported target, selectors, thresholds, and repair skills.
# Validate with just lint-config-check; inspect capabilities with just lint-rules.
# Every rule accepts enabled: false; include/exclude/extensions select its scope.
# Supports any selected UTF-8 language, including shell.
# Supports directories, independent of language; no extensions.
# DECISION: D021
# All language rules block delivery; the same defaults are installed in consumers.
# Supports Rust (.rs), Python (.py/.pyi); other languages are rejected.
# Supports Rust (.rs), Python (.py/.pyi); other languages are rejected.
# Supports Rust (.rs), Python (.py/.pyi); other languages are rejected.
version: 1
config_skill: .agents/skills/repair/SKILL.md
exclude:
- .git
- .git/**
- .cache
- .cache/**
- '**/__pycache__'
- '**/__pycache__/**'
- '**/.venv'
- '**/.venv/**'
- '**/target'
- '**/target/**'
# DECISION: D112
- Project/shared/syntax/tree-sitter-rust
- Project/shared/syntax/tree-sitter-rust/**
rules:
- id: file-size
  kind: nonblank-lines
  target: file
  include:
  - '**'
  extensions:
  - .py
  - .sh
  - .rs
  - .go
  - .c
  - .h
  - .cpp
  - .cs
  - .java
  - .json
  - .md
  - .toml
  - .txt
  - .yaml
  - .yml
  exclude:
  # DECISION: D116 -- the lint configuration is a flat rule registry read as one file.
  - .agentrig/lint.yaml
  warning: 300
  error: 500
  warning_skill: .agents/skills/refactor-large-file/SKILL.md
  error_skill: .agents/skills/refactor-large-file/SKILL.md
# DECISION: D036
- id: markdown-size
  kind: nonblank-lines
  target: file
  include:
  - '**/README.md'
  - '**/AGENTS.md'
  exclude:
  - Ledger/**
  error: 70
  warning_skill: .agents/skills/condense-markdown/SKILL.md
  error_skill: .agents/skills/condense-markdown/SKILL.md
- id: markdown-width
  kind: line-width
  target: file
  include:
  - '**/README.md'
  - '**/AGENTS.md'
  exclude:
  - Ledger/**
  error: 120
  warning_skill: .agents/skills/condense-markdown/SKILL.md
  error_skill: .agents/skills/condense-markdown/SKILL.md
- id: markdown-placement
  kind: forbidden-file
  target: file
  include:
  - Project/**
  extensions:
  - .md
  exclude:
  - '**/README.md'
  - '**/AGENTS.md'
  - '**/SKILL.md'
  level: error
  warning_skill: .agents/skills/condense-markdown/SKILL.md
  error_skill: .agents/skills/condense-markdown/SKILL.md
- id: directory-size
  kind: directory-entries
  target: directory
  include:
  - '**'
  exclude:
  - Ledger/Decisions
  - Ledger/Invariants
  # DECISION: D029 -- memory requires a flat indexed Plan/NNN.md registry.
  - Ledger/Plan
  # DECISION: D030 -- Backlog uses the same flat indexed memory representation.
  - Ledger/Backlog
  # DECISION: D048 -- the Plan archive is the same flat indexed registry.
  - Ledger/Archive/Plan
  # DECISION: D056 -- the Backlog archive is the same flat indexed registry.
  - Ledger/Archive/Backlog
