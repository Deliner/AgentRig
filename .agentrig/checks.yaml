  # Commit and merge checks use affected groups plus smoke tests; `just check` runs everything.
  affected:
  - include: ['**']
    targets: [Project/structural_lint/config/tests/test_config_check.py]
  - include:
    - Project/structural_lint/**
    - Project/shared/arguments/**
    - Project/shared/diagnostics/**
    - Project/shared/paths/**
    - Project/shared/syntax/**
    - Project/shared/vcs/**
