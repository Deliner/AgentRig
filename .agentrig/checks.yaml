- id: rust-test
  kind: command
  skill: .agents/skills/repair/SKILL.md
  command: rust-test
  affected:
  - {include: ['**'], targets: ['structural_lint::tests::configuration::', 'structural_lint::tests::discovery::']}
  - include: ['.agentrig/**', 'Project/Cargo.*', 'Project/lib.rs', 'Project/command_line/main.rs', 'Project/shared/mod.rs', 'Project/shared/console/**']
    targets: ['::']
  - include: ['Project/structural_lint/**', 'Project/shared/testing/**']
    targets: ['structural_lint::', 'command_line::', 'command_runner::', 'project_config::', 'project_memory::', 'project_setup::', 'agent_hooks::']
  - include: ['Project/command_line/**', 'Project/command_runner/**', 'Project/change_delivery/**', 'Project/project_config/**', 'Project/project_memory/**', 'Project/project_setup/**', 'Project/shared/testing/**']
    targets: ['command_line::', 'command_runner::', 'project_config::', 'project_memory::', 'project_setup::', 'agent_hooks::']
  - include: ['Project/command_line/mod.rs', 'Project/command_runner/**', 'Project/change_delivery/**', 'Project/project_config/**', 'Project/project_memory/evidence/**', 'Project/shared/testing/**', 'Project/agent_hooks/**']
    targets: ['change_delivery::git::']
  - include: ['Project/**']
    targets: ['project_setup::tests::delivery::', 'project_setup::initialization::tests::', 'project_memory::tests::oracles::']
  - include: ['Project/clippy.toml', 'Project/shared/skills/**']
    targets: ['project_setup::tests::', 'project_config::tests::settings::', 'project_memory::tests::', 'agent_hooks::tests::shell::', 'agent_hooks::tests::memory::']
  - include: ['Project/command_line/mod.rs', 'Project/command_runner/**', 'Project/change_delivery/**', 'Project/project_config/**', 'Project/project_memory/**', 'Project/shared/paths/**', 'Project/shared/arguments/**', 'Project/shared/diagnostics/**', 'Project/shared/artifacts/**', 'Project/shared/vcs/**', 'Project/shared/yaml/**', 'Project/shared/testing/**']
    targets: ['change_delivery::gate::']
  - include: ['Project/agent_hooks/**']
    targets: ['agent_hooks::', 'command_runner::tests::', 'project_config::tests::']
  - include: ['Project/command_runner/jobs/**', 'Project/shared/artifacts/**']
    targets: ['shared::artifacts::', 'command_line::', 'command_runner::', 'change_delivery::', 'project_config::', 'project_memory::', 'project_setup::', 'agent_hooks::']
  - include: ['Project/shared/paths/**']
    targets: ['shared::paths::', 'structural_lint::', 'command_line::', 'command_runner::', 'change_delivery::', 'project_config::', 'project_memory::', 'project_setup::', 'agent_hooks::']
  - include: ['Project/shared/arguments/**']
    targets: ['shared::arguments::', 'structural_lint::', 'command_line::', 'command_runner::', 'change_delivery::', 'project_config::', 'project_memory::', 'project_setup::', 'agent_hooks::']
  - include: ['Project/shared/vcs/**', 'Project/shared/yaml/**', 'Project/shared/diagnostics/**', 'Project/shared/syntax/**']
    targets: ['shared::vcs::', 'shared::yaml::', 'shared::diagnostics::', 'structural_lint::', 'command_line::', 'command_runner::', 'change_delivery::', 'project_config::', 'project_memory::', 'project_setup::', 'agent_hooks::']
  - include: ['Project/shared/fs/**']
    targets: ['shared::fs::', 'shared::artifacts::', 'shared::paths::', 'shared::vcs::', 'shared::yaml::', 'shared::diagnostics::', 'structural_lint::', 'command_line::', 'command_runner::', 'change_delivery::', 'project_config::', 'project_memory::', 'project_setup::', 'agent_hooks::']
