    - Project/command_runner/tests
    - Project/command_runner/registry/tests
    - Project/project_config/tests
    - Project/project_memory/evidence/tests
    - Project/project_memory/tests
    - Project/change_delivery/gate/tests
    - Project/project_setup/tests
