- id: test
  kind: command
  skill: .agents/skills/repair/SKILL.md
  command: test
  # Commit and merge checks use affected groups plus smoke tests; `just check` runs everything.
  affected:
  - {include: ['**'], targets: []}
  - include:
    - Project/command_line/mod.rs
    - Project/project_config/**
    - Project/project_config/settings/**
    - Project/shared/paths/**
    - Project/shared/arguments/**
    - Project/shared/diagnostics/**
    - Project/command_runner/jobs/**
    - Project/shared/artifacts/**
    - Project/shared/vcs/**
    - Project/shared/yaml/**
    - Project/shared/testing/**
    targets:
    - Project/shared/testing/examples/python/application/test_sample.py
    - tooling/distribution/tests/test_launcher.py
  - include:
    - Project/clippy.toml
    - Project/project_setup/**
    - Project/shared/skills/**
    targets:
    - tooling/distribution/tests/test_launcher.py
  - include:
    - tooling/worker/**
    - tooling/distribution/tests/**
    targets:
    - tooling/distribution/tests/test_launcher.py
