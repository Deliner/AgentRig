reminder: .agentrig/skills/complexity-discipline/context-reminder.json
discipline_skill: .agentrig/skills/complexity-discipline/SKILL.md
routes:
- include: [Project/**, tooling/**]
  skill: .agentrig/skills/refactor-large-directory/SKILL.md
  events: [edit]
  block: true
- include: ['Ledger/Plan/**']
  skill: .agentrig/skills/edit-plan/SKILL.md
  events: [edit, shell]
- include: ['Ledger/Archive/**']
  skill: .agentrig/skills/edit-plan/SKILL.md
  events: [edit, shell]
- include: ['Ledger/Backlog/**']
  skill: .agentrig/skills/edit-backlog/SKILL.md
  events: [edit, shell]
- include: [Ledger/Decisions.md, 'Ledger/Decisions/**/*.md']
  skill: .agentrig/skills/edit-decisions/SKILL.md
  events: [edit, shell]
- include: [Ledger/Invariants.md, 'Ledger/Invariants/**/*.md']
  skill: .agentrig/skills/edit-invariants/SKILL.md
  events: [edit, shell]
- include: [Ledger/State.md, 'Ledger/State/**/*.md']
  skill: .agentrig/skills/edit-state/SKILL.md
  events: [edit, shell]
- include: [Ledger/State.md, 'Ledger/State/**/*.md']
  skill: .agentrig/skills/edit-state/SKILL.md
  events: [check]
  block: true
# DECISION: D186
- include: [Ledger/Decisions.md, 'Ledger/Decisions/**/*.md']
  skill: .agentrig/skills/norm-or-choice/SKILL.md
  events: [edit]
  block: true
- include: ['Project/agent_hooks/**', 'Project/change_delivery/**']
  skill: .agentrig/skills/fail-closed-enforcement/SKILL.md
  events: [edit]
- include: [Ledger/Glossary.md]
  skill: .agentrig/skills/edit-glossary/SKILL.md
  events: [edit, shell]
protected:
- tooling/worker
- tooling/distribution/bootstrap.sh
- .cache/development
- Project/project_setup/initialization/tests/rig_differences.yaml
- Ledger/NorthStar.md
