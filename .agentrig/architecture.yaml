purpose: Configure the runtime for this repository and dispatch its Git hooks to it
files:
  project.yaml: Schema version, runtime version, repair skill and repository paths
  git.yaml: Base branch and feature branch prefix
  commands.yaml: Command catalog exposed through Just recipes
  checks.yaml: Gate checks, impact map and repair skills
  hooks.yaml: Reminder, discipline skill and memory edit routes
  oracles.yaml: Executable oracles bound to invariants
  lint.yaml: Repository lint policy and repair guidance
directories:
  hooks: Dispatch repository commit and reference guards
