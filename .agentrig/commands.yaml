read:
  purpose: Inspect files and Git history with configured programs
  argv: []
  accepts_args: true
  access: read-only
  programs:
    git:
      subcommands: [status, diff, log, show, rev-parse, branch, ls-files, grep, blame, merge-base, describe, cat-file, ls-tree]
      deny: [-O, --open-files-in-pager]
    ls: {}
    cat: {}
    head: {}
    tail: {}
    wc: {}
    grep: {}
    # DECISION: D202
    rg: {deny: [--pre, --hostname-bin]}
    sed: {}
    diff: {}
    stat: {}
    find: {deny: [-exec, -ok]}
write:
  purpose: Change files and Git state with configured programs
  argv: []
  accepts_args: true
  # DECISION: D203
  access: project
  programs:
    git:
      subcommands: [add, commit, rm, mv, restore, switch, checkout, stash, cherry-pick, rebase, branch]
      # DECISION: D204
      deny: [--exec, -x, --no-verify, -n]
      access: unconfined
    mkdir: {}
    cp: {}
    mv: {}
    rm: {}
    touch: {}
    chmod: {}
    # DECISION: D198
    ln: {}
build:
  purpose: Build the candidate runtime from Project and print its version
  doc: Project/README.md#build
  argv:
  - tooling/worker/build
  - --version
candidate:
  purpose: Build and run the candidate runtime with the given arguments
  doc: tooling/distribution/README.md
  argv:
  - tooling/worker/build
  accepts_args: true
lint:
  purpose: Lint the repository with the candidate runtime
  doc: Project/README.md#lint
  argv: [tooling/worker/build, lint]
  accepts_args: true
bootstrap:
  purpose: Install a development runtime revision; without a revision install the pinned one
  doc: tooling/distribution/README.md
  argv: [bash, tooling/distribution/bootstrap.sh]
  accepts_args: true
propose-pin:
  purpose: Pin a gated HEAD under the user's consent, or prepare moving the runtime pin for the user's approval, and list the source files it changes
  doc: tooling/distribution/README.md
  argv: [.agentrig/bin/agentrig, propose-pin]
  accepts_args: true
release:
  purpose: Build and assemble portable release artifacts
  doc: tooling/distribution/RELEASE.md
  argv:
  - bash
  - tooling/distribution/release.sh
codex:
  purpose: Run a Codex agent non-interactively on a task, such as a live check of the rig with Codex in a test project
  argv: [codex, exec]
  accepts_args: true
rustfmt:
  purpose: Check Rust formatting
  argv:
  - cargo
  - fmt
  - --manifest-path
  - Project/Cargo.toml
  - --check
test:
  purpose: Run the project tests, optionally filtered by test name
  argv:
  - cargo
  - test
  - --manifest-path
  - Project/Cargo.toml
  - --locked
  - --lib
  - --
  # DECISION: D202
  accepts_args: operands
  output:
    success: {matching: ["test result:"]}
    failure: {matching: [FAILED, panicked, "error", "test result:"]}
ruff-format:
  purpose: Check Python formatting
  argv:
  - uv
  - run
  - --locked
  - --project
  - tooling
  - ruff
  - format
  - --check
  - --config
  - tooling/pyproject.toml
ruff:
  purpose: Check Python code with Ruff
  argv:
  - uv
  - run
  - --locked
  - --project
  - tooling
  - ruff
  - check
  - --config
  - tooling/pyproject.toml
mypy:
  purpose: Type-check Python tests and fixtures
  argv: ["uv", "run", "--locked", "--project", "tooling", "mypy", "--config-file", "tooling/pyproject.toml", "Project/shared"]
typos:
  purpose: Check spelling across the repository
  argv:
  - uv
  - run
  - --locked
  - --project
  - tooling
  - typos
  - --config
  - tooling/pyproject.toml
  - .
vulture:
  purpose: Report unused Python code
  argv: ["uv", "run", "--locked", "--project", "tooling", "vulture", "--min-confidence", "100", "Project/shared"]
