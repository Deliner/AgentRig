read:
  argv: []
  accepts_args: true
  read_only: true
write:
  argv: []
  accepts_args: true
build:
  argv:
  - tooling/worker/build
  - --version
candidate:
  argv:
  - tooling/worker/build
  accepts_args: true
lint:
  argv: [tooling/worker/build, lint]
  accepts_args: true
release:
  argv:
  - bash
  - tooling/distribution/release.sh
rustfmt:
  argv:
  - cargo
  - +1.98.1
  - fmt
  - --manifest-path
  - Project/Cargo.toml
  - --check
clippy:
  argv:
  - cargo
  - +1.98.1
  - clippy
  - --manifest-path
  - Project/Cargo.toml
  - --locked
  - --
  - -D
  - warnings
rust-test:
  argv:
  - cargo
  - +1.98.1
  - test
  - --manifest-path
  - Project/Cargo.toml
  - --locked
  - --lib
  - --
  accepts_args: true
test:
  argv:
  - uv
  - run
  - --locked
  - --project
  - Project
  - pytest
  - -c
  - Project/pyproject.toml
  - --rootdir
  - .
  accepts_args: true
ruff-format:
  argv:
  - uv
  - run
  - --locked
  - --project
  - Project
  - ruff
  - format
  - --check
  - --config
  - Project/pyproject.toml
ruff:
  argv:
  - uv
  - run
  - --locked
  - --project
  - Project
  - ruff
  - check
  - --config
  - Project/pyproject.toml
mypy:
  argv: ["uv", "run", "--locked", "--project", "Project", "mypy", "--config-file", "Project/pyproject.toml", "Project/conftest.py", "tooling/distribution/tests", "Project/src/lint", "Project/src/scaffold", "Project/src/hooks", "Project/examples"]
typos:
  argv:
  - uv
  - run
  - --locked
  - --project
  - Project
  - typos
  - --config
  - Project/pyproject.toml
  - .
vulture:
  argv: ["uv", "run", "--locked", "--project", "Project", "vulture", "--min-confidence", "100", "Project/conftest.py", "tooling/distribution/tests", "Project/src/lint", "Project/src/scaffold", "Project/src/hooks", "Project/examples"]
