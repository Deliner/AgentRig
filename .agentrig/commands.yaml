read:
  purpose: Inspect files and Git history with configured programs
  argv: []
  accepts_args: true
  read_only: true
  programs:
    git:
      subcommands: [status, diff, log, show, rev-parse, branch, ls-files, grep, blame, merge-base, describe, cat-file, ls-tree]
      deny: [-O, --open-files-in-pager]
    ls: {}
    cat: {}
    head: {}
    tail: {}
    wc: {}
    grep: {}
    rg: {deny: [--pre]}
    sed: {}
    diff: {}
    stat: {}
    find: {deny: [-exec, -ok]}
write:
  purpose: Change files and Git state with configured programs
  argv: []
  accepts_args: true
  programs:
    git:
      subcommands: [add, commit, rm, mv, restore, switch, checkout, stash, cherry-pick, rebase, branch]
      deny: [--exec, -x]
    mkdir: {}
    cp: {}
    mv: {}
    rm: {}
    touch: {}
    chmod: {}
build:
  purpose: Build the candidate runtime from Project and print its version
  doc: Project/README.md#build
  argv:
  - tooling/worker/build
  - --version
candidate:
  purpose: Build and run the candidate runtime with the given arguments
  doc: tooling/distribution/README.md
  argv:
  - tooling/worker/build
  accepts_args: true
lint:
  purpose: Lint the repository with the candidate runtime
  doc: Project/README.md#lint
  argv: [tooling/worker/build, lint]
  accepts_args: true
release:
  purpose: Build and assemble portable release artifacts
  doc: tooling/distribution/RELEASE.md
  argv:
  - bash
  - tooling/distribution/release.sh
rustfmt:
  purpose: Check Rust formatting
  argv:
  - cargo
  - +1.98.1
  - fmt
  - --manifest-path
  - Project/Cargo.toml
  - --check
clippy:
  purpose: Check Rust code with Clippy, denying warnings
  argv:
  - cargo
  - +1.98.1
  - clippy
  - --manifest-path
  - Project/Cargo.toml
  - --locked
  - --
  - -D
  - warnings
  - -D
  - clippy::panic
  - -D
  - clippy::todo
  - -D
  - clippy::unimplemented
  - -D
  - clippy::dbg_macro
  - -D
  - clippy::unreachable
  - -D
  - clippy::expect_used
  - -D
  - clippy::unwrap_used
  - -D
  - clippy::let_underscore_must_use
  - -D
  - clippy::exit
  - -D
  - clippy::should_panic_without_expect
  - -D
  - clippy::missing_fields_in_debug
  - -D
  - clippy::rest_pat_in_fully_bound_structs
  - -D
  - clippy::self_named_module_files
  - -D
  - clippy::print_stdout
  - -D
  - clippy::print_stderr
  - -D
  - clippy::string_slice
  - -D
  - clippy::iter_over_hash_type
  - -D
  - clippy::collection_is_never_read
  - -D
  - clippy::read_zero_byte_vec
  - -D
  - clippy::unchecked_time_subtraction
  - -D
  - clippy::map_err_ignore
  - -D
  - clippy::partial_pub_fields
rust-test:
  purpose: Run Rust library tests, optionally filtered by test path
  argv:
  - cargo
  - +1.98.1
  - test
  - --manifest-path
  - Project/Cargo.toml
  - --locked
  - --lib
  - --
  accepts_args: true
  output:
    success: {matching: ["test result:"]}
    failure: {matching: [FAILED, panicked, "error", "test result:"]}
test:
  purpose: Run Python behavior tests, optionally limited to paths
  argv:
  - uv
  - run
  - --locked
  - --project
  - tooling
  - pytest
  - -c
  - tooling/pyproject.toml
  - --rootdir
  - .
  accepts_args: true
  output:
    success: {tail: 1}
    failure: {matching: [FAILED, ERROR], tail: 1}
ruff-format:
  purpose: Check Python formatting
  argv:
  - uv
  - run
  - --locked
  - --project
  - tooling
  - ruff
  - format
  - --check
  - --config
  - tooling/pyproject.toml
ruff:
  purpose: Check Python code with Ruff
  argv:
  - uv
  - run
  - --locked
  - --project
  - tooling
  - ruff
  - check
  - --config
  - tooling/pyproject.toml
mypy:
  purpose: Type-check Python tests and fixtures
  argv: ["uv", "run", "--locked", "--project", "tooling", "mypy", "--config-file", "tooling/pyproject.toml", "Project/conftest.py", "tooling/distribution/tests", "Project/agent_hooks", "Project/change_delivery", "Project/command_runner", "Project/project_config", "Project/project_memory", "Project/project_setup", "Project/shared", "Project/structural_lint"]
typos:
  purpose: Check spelling across the repository
  argv:
  - uv
  - run
  - --locked
  - --project
  - tooling
  - typos
  - --config
  - tooling/pyproject.toml
  - .
vulture:
  purpose: Report unused Python code
  argv: ["uv", "run", "--locked", "--project", "tooling", "vulture", "--min-confidence", "100", "Project/conftest.py", "tooling/distribution/tests", "Project/agent_hooks", "Project/change_delivery", "Project/command_runner", "Project/project_config", "Project/project_memory", "Project/project_setup", "Project/shared", "Project/structural_lint"]
