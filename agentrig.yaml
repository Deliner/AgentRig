version: 1
runtime: 0.3.0
config_skill: .agents/skills/repair/SKILL.md
processes:
  foreground: systemd
paths:
  sources:
  - tooling/**
  - Project/**
  memory: Ledger
  skills: .agents/skills
  lint: tooling/worker/lint.yaml
  runtime: .cache/runtime
git:
  base: master
  prefix: feature/
commands:
  read:
    argv: []
    accepts_args: true
    read_only: true
  write:
    argv: []
    accepts_args: true
  build:
    argv:
    - tooling/worker/build
    - --version
  candidate:
    argv:
    - tooling/worker/build
    accepts_args: true
  release:
    argv:
    - bash
    - tooling/distribution/release.sh
  rustfmt:
    argv:
    - cargo
    - +1.98.1
    - fmt
    - --manifest-path
    - tooling/worker/Cargo.toml
    - --check
  clippy:
    argv:
    - cargo
    - +1.98.1
    - clippy
    - --manifest-path
    - tooling/worker/Cargo.toml
    - --locked
    - --
    - -D
    - warnings
  rust-test:
    argv:
    - cargo
    - +1.98.1
    - test
    - --manifest-path
    - tooling/worker/Cargo.toml
    - --locked
    - --lib
    - --
    accepts_args: true
  test:
    argv:
    - uv
    - run
    - --locked
    - --project
    - tooling
    - pytest
    - -c
    - tooling/pyproject.toml
    - --rootdir
    - .
    accepts_args: true
  ruff-format:
    argv:
    - uv
    - run
    - --locked
    - --project
    - tooling
    - ruff
    - format
    - --check
    - --config
    - tooling/pyproject.toml
  ruff:
    argv:
    - uv
    - run
    - --locked
    - --project
    - tooling
    - ruff
    - check
    - --config
    - tooling/pyproject.toml
  mypy:
    argv: ["uv", "run", "--locked", "--project", "tooling", "mypy", "--config-file", "tooling/pyproject.toml", "tooling/tests", "tooling/conftest.py", "tooling/worker/src/lint", "tooling/worker/examples"]
  typos:
    argv:
    - uv
    - run
    - --locked
    - --project
    - tooling
    - typos
    - --config
    - tooling/pyproject.toml
    - .
  vulture:
    argv: ["uv", "run", "--locked", "--project", "tooling", "vulture", "--min-confidence", "100", "tooling/tests", "tooling/conftest.py", "tooling/worker/src/lint", "tooling/worker/examples"]
  review-test:
    accepts_args: true
    argv:
    - uv
    - run
    - --locked
    - --project
    - tooling
    - cargo
    - +1.98.1
    - test
    - --manifest-path
    - tooling/worker/review/Cargo.toml
    - --locked
  review-clippy:
    argv:
    - cargo
    - +1.98.1
    - clippy
    - --manifest-path
    - tooling/worker/review/Cargo.toml
    - --locked
    - --all-targets
    - --
    - -D
    - warnings
  review-rustfmt:
    argv:
    - cargo
    - +1.98.1
    - fmt
    - --manifest-path
    - tooling/worker/review/Cargo.toml
    - --check
  review:
    argv:
    - tooling/worker/run
    - review
    accepts_args: true
hooks:
  reminder: .agents/skills/complexity-discipline/context-reminder.json
  discipline_skill: .agents/skills/complexity-discipline/SKILL.md
  routes:
  - include:
    - Ledger/Plan.md
    - Ledger/Plan/**/*.md
    skill: .agents/skills/edit-plan/SKILL.md
  - include:
    - Ledger/Decisions.md
    - Ledger/Decisions/**/*.md
    skill: .agents/skills/edit-decisions/SKILL.md
  - include:
    - Ledger/Invariants.md
    - Ledger/Invariants/**/*.md
    skill: .agents/skills/edit-invariants/SKILL.md
  - include:
    - Ledger/State.md
    - Ledger/State/**/*.md
    skill: .agents/skills/edit-state/SKILL.md
oracles:
  I001:
    check: test
    runner: pytest
    target: tooling/tests/native/scaffold/test_memory.py::test_decision_source_markers
  I002:
    check: test
    runner: pytest
    target: tooling/tests/native/scaffold/test_integration.py::test_independent_project_delivery
  I003:
    check: test
    runner: pytest
    target: tooling/tests/native/scaffold/test_memory.py::test_committed_decisions_checked_against_staged_memory
  I004:
    check: test
    runner: pytest
    target: tooling/worker/src/lint/tests/test_lint.py::test_native_lint_thresholds_and_skills
  I005:
    check: test
    runner: pytest
    target: tooling/tests/native/scaffold/test_hooks.py::test_shell_guard_rejects_bypass
  I006:
    check: test
    runner: pytest
    target: tooling/tests/native/scaffold/test_git.py::test_staged_commit_preserves_unstaged_work
  I007:
    check: test
    runner: pytest
    target: tooling/tests/native/scaffold/test_reminders.py::test_portable_reminder_schedule_retry_and_compaction
  I008:
    check: test
    runner: pytest
    target: tooling/tests/native/scaffold/test_memory.py::test_repository_layout_and_detail_contract
  I009:
    check: test
    runner: pytest
    target: tooling/tests/native/scaffold/test_plan.py::test_plan_delivery_contract
  I010:
    check: test
    runner: pytest
    target: tooling/tests/native/scaffold/test_git.py::test_divergent_rebase_preserves_merge_history
  I011:
    check: test
    runner: pytest
    target: tooling/tests/native/scaffold/test_state.py::test_state_recovery_contract
  I012:
    check: test
    runner: pytest
    target: tooling/tests/native/scaffold/test_hooks.py::test_ledger_edit_guidance
  I014:
    check: test
    runner: pytest
    target: tooling/worker/src/lint/tests/test_lint.py::test_invalid_config_is_actionable
  I015:
    check: test
    runner: pytest
    target: tooling/worker/src/lint/languages/tests/test_language.py::test_language_conditions
  I016:
    check: test
    runner: pytest
    target: tooling/worker/src/lint/config/tests/test_config_check.py::test_config_rejects_unsupported_language
  I017:
    check: test
    runner: pytest
    target: tooling/tests/native/scaffold/test_strict.py::test_strict_defaults_block_delivery
  I018:
    check: test
    runner: pytest
    target: tooling/tests/native/scaffold/test_feedback.py::test_evidence_tracks_content_and_partial_checks
  I019:
    check: test
    runner: pytest
    target: tooling/tests/native/scaffold/test_feedback.py::test_resume_observes_real_conflict
  I020:
    check: test
    runner: pytest
    target: tooling/tests/native/scaffold/test_package.py::test_installation_manifest_records_ownership

checks:
- id: build
  kind: command
  skill: .agents/skills/repair/SKILL.md
  command: build
- id: lint
  kind: lint
  skill: .agents/skills/repair/SKILL.md
- id: memory
  kind: memory
  skill: .agents/skills/repair/SKILL.md
- id: rustfmt
  kind: command
  skill: .agents/skills/repair/SKILL.md
  command: rustfmt
- id: clippy
  kind: command
  skill: .agents/skills/repair/SKILL.md
  command: clippy
- id: rust-test
  kind: command
  skill: .agents/skills/repair/SKILL.md
  command: rust-test
  affected:
  - {include: ['**'], targets: []}
  - include: [agentrig.yaml, 'tooling/worker/Cargo.*', tooling/worker/src/lib.rs, tooling/worker/src/main.rs, tooling/worker/src/util.rs]
    targets: ['::']
  - include: ['tooling/worker/src/lint/**']
    targets: ['lint::', 'scaffold::', 'hooks::']
  - include: ['tooling/worker/src/scaffold/**']
    targets: ['scaffold::', 'hooks::']
  - include: ['tooling/worker/src/hooks/**']
    targets: ['hooks::']
  - include: ['tooling/worker/src/delegate/**', 'tooling/worker/src/environment/**', 'tooling/worker/src/jobs/**']
    targets: ['delegate::', 'scaffold::', 'hooks::']
  - include: ['tooling/worker/src/composition/**']
    targets: ['composition::', 'delegate::', 'scaffold::']
  - include: ['tooling/worker/src/resources/**']
    targets: ['resources::', 'delegate::', 'scaffold::']
  - include: ['tooling/worker/src/paths/**']
    targets: ['paths::', 'resources::', 'delegate::', 'scaffold::', 'hooks::']
  - include: ['tooling/worker/src/arguments/**']
    targets: ['arguments::', 'lint::', 'delegate::', 'scaffold::']
  - include: ['tooling/worker/review/**']
    targets: ['lint::', 'delegate::', 'scaffold::']
- id: ruff-format
  kind: command
  skill: .agents/skills/repair/SKILL.md
  command: ruff-format
- id: ruff
  kind: command
  skill: .agents/skills/repair/SKILL.md
  command: ruff
- id: mypy
  kind: command
  skill: .agents/skills/repair/SKILL.md
  command: mypy
- id: test
  kind: command
  skill: .agents/skills/repair/SKILL.md
  command: test
  # Commit checks use affected groups plus smoke tests; merge runs everything.
  affected:
  - include: ['**']
    targets: [tooling/worker/src/lint/config/tests/test_config_check.py]
  - include:
    - tooling/worker/src/lint/**
    - tooling/worker/src/arguments/**
    - tooling/worker/review/src/vcs/**
    - tooling/worker/review/src/config/yaml.rs
    targets:
    - tooling/worker/src/lint/tests
    - tooling/worker/src/lint/inventory/tests
    - tooling/worker/src/lint/architecture/tests
    - tooling/worker/src/lint/languages/tests/test_language.py
    - tooling/worker/src/lint/languages/tests/test_language_delivery.py
    - tooling/tests/native/scaffold/test_strict.py
    - tooling/tests/native/scaffold/test_memory.py
  - include:
    - tooling/worker/src/delegate/**
    - tooling/worker/src/environment/**
    - tooling/worker/src/composition/**
    - tooling/worker/src/resources.rs
    - tooling/worker/src/resources/**
    - tooling/worker/src/jobs/**
    - tooling/worker/review/src/**
    - tooling/tests/native/test_delegate*.py
    targets:
    - tooling/tests/native/test_delegate_code.py
    - tooling/tests/native/test_delegate_config.py
    - tooling/tests/native/test_delegate_mcp.py
    - tooling/tests/native/test_delegate_run.py
    - tooling/tests/native/test_delegate_vcs.py
    - tooling/tests/native/scaffold/test_setup.py
    - tooling/tests/native/scaffold/test_capabilities.py
    - tooling/tests/native/upgrades
  - include:
    # Shared configuration and dispatch affect every scaffold consumer.
    - tooling/worker/src/scaffold/mod.rs
    - tooling/worker/src/scaffold/config/**
    - tooling/worker/src/scaffold/settings/**
    - tooling/worker/src/paths/**
    - tooling/worker/src/arguments/**
    - tooling/worker/src/environment/**
    - tooling/worker/src/composition/**
    - tooling/worker/src/resources.rs
    - tooling/worker/src/resources/**
    - tooling/worker/src/jobs/**
    - tooling/worker/review/src/vcs/**
    - tooling/worker/review/src/config/yaml.rs
    - tooling/tests/native/scaffold/**
    - tooling/tests/native/upgrades/**
    targets:
    - tooling/tests/native/scaffold/test_capabilities.py
    - tooling/tests/native/scaffold/test_commands.py
    - tooling/tests/native/scaffold/test_feedback.py
    - tooling/tests/native/scaffold/test_gate.py
    - tooling/tests/native/scaffold/test_git.py
    - tooling/tests/native/scaffold/test_hooks.py
    - tooling/tests/native/scaffold/test_memory.py
    - tooling/tests/native/scaffold/test_package.py
    - tooling/tests/native/scaffold/test_plan.py
    - tooling/tests/native/scaffold/test_reminders.py
    - tooling/tests/native/scaffold/test_setup.py
    - tooling/tests/native/scaffold/test_state.py
    - tooling/tests/native/scaffold/test_strict.py
    - tooling/tests/native/upgrades
    - tooling/tests/native/test_launcher.py
  - include:
    - tooling/worker/src/scaffold/memory/**
    targets:
    - tooling/tests/native/scaffold/test_memory.py
    - tooling/tests/native/scaffold/test_plan.py
    - tooling/tests/native/scaffold/test_state.py
    - tooling/tests/native/scaffold/test_feedback.py
    - tooling/tests/native/scaffold/test_gate.py
    - tooling/tests/native/scaffold/test_package.py
  - include:
    - tooling/worker/src/scaffold/commands.rs
    - tooling/worker/src/scaffold/process.rs
    - tooling/worker/src/scaffold/commands/**
    targets:
    - tooling/tests/native/scaffold/test_commands.py
    - tooling/tests/native/scaffold/test_memory.py
    - tooling/tests/native/scaffold/test_gate.py
    - tooling/tests/native/scaffold/test_git.py
    - tooling/tests/native/upgrades
  - include:
    - tooling/worker/src/scaffold/git.rs
    - tooling/worker/src/scaffold/gate.rs
    - tooling/worker/src/scaffold/gate/**
    - tooling/worker/src/scaffold/evidence/**
    targets:
    - tooling/tests/native/scaffold/test_git.py
    - tooling/tests/native/scaffold/test_gate.py
    - tooling/tests/native/scaffold/test_feedback.py
    - tooling/tests/native/scaffold/test_state.py
  - include:
    - tooling/worker/src/hooks/**
    targets:
    - tooling/tests/native/scaffold/test_hooks.py
    - tooling/tests/native/scaffold/test_reminders.py
    - tooling/tests/native/scaffold/test_commands.py
    - tooling/tests/native/scaffold/test_git.py
  - include:
    - tooling/worker/src/scaffold/package/**
    - tooling/worker/src/scaffold/{receipt,installation}/**
    - tooling/worker/src/scaffold/recovery/**
    targets:
    - tooling/tests/native/scaffold/test_setup.py
    - tooling/tests/native/scaffold/test_package.py
    - tooling/tests/native/scaffold/test_capabilities.py
    - tooling/tests/native/scaffold/test_strict.py
    - tooling/tests/native/scaffold/test_hooks.py
    - tooling/tests/native/scaffold/test_state.py
    - tooling/tests/native/upgrades
    - tooling/tests/native/test_launcher.py
  - include:
    - tooling/worker/src/scaffold/upgrade/**
    targets:
    - tooling/tests/native/upgrades
    - tooling/tests/native/scaffold/test_setup.py
    - tooling/tests/native/scaffold/test_memory.py
  - include:
    - tooling/tests/native/scaffold/test_integration.py
    targets:
    - tooling/tests/native/scaffold/test_integration.py
  - include:
    - tooling/worker/review/src/**
    - tooling/tests/native/test_review.py
    targets:
    - tooling/tests/native/test_review.py
    - tooling/tests/native/scaffold/test_capabilities.py
- id: typos
  kind: command
  skill: .agents/skills/repair/SKILL.md
  command: typos
- id: vulture
  kind: command
  skill: .agents/skills/repair/SKILL.md
  command: vulture
- id: review-test
  kind: command
  command: review-test
  affected:
  - {include: ['**'], targets: []}
  - include: [agentrig.yaml, 'tooling/worker/review/**']
    targets: ['--']
  include:
  - tooling/worker/review/**
  skill: .agents/skills/repair/SKILL.md
- id: review-clippy
  kind: command
  command: review-clippy
  include:
  - tooling/worker/review/**
  skill: .agents/skills/repair/SKILL.md
- id: review-rustfmt
  kind: command
  command: review-rustfmt
  include:
  - tooling/worker/review/**
  skill: .agents/skills/repair/SKILL.md
