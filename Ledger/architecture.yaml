purpose: Preserve delivery outcomes, durable choices, executable invariants and current recovery facts
files:
  architecture.yaml: Project knowledge inventory and responsibility map
  Plan.md: Outcomes explicitly selected for current execution
  Backlog.md: Unordered future ideas, improvements and hypotheses
  Decisions.md: Immutable decision statements and current application links
  Invariants.md: Observable predicates linked to marked executable oracles
  State.md: Factual current work and recovery snapshot
  Requests.md: Original user requests and clarifications underlying current delivery contracts
directories:
  Plan: Current execution scope, acceptance and handoff context
  Archive: Completed outcome indexes and cards preserved outside current Plan
  Backlog: Idea context, proposals and expected benefits
  Decisions: Historical context and rationale for durable choices
  Invariants: Detailed predicates and exact executable oracle descriptions
allow: []
deny: []
public: []
