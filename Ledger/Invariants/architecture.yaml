purpose: Bind observable repository predicates to exact executable checks
files:
  architecture.yaml: Detail file inventory and knowledge responsibility map
  001.md: "Predicate and oracle for: Every linked Rust, Python or shell decision application exists and carries its decision marker."
  002.md: "Predicate and oracle for: Every invariant links an existing test carrying its invariant marker."
  003.md: "Predicate and oracle for: Committed decision identities, statements and details are immutable; current application links point to existing marked owners."
  004.md: "Predicate and oracle for: File and directory soft limits warn while hard limits fail."
  005.md: "Predicate and oracle for: Agent shell tools accept only one top-level invocation of a catalogued Just recipe."
  006.md: "Predicate and oracle for: Failed staged checks reject commits; repeated edits and corrections remain available, and unrelated unstaged work is excluded."
  007.md: "Predicate and oracle for: Complexity reminders use the configured attention and full-refresh intervals."
  008.md: "Predicate and oracle for: Project and Ledger are sibling roots, and every indexed Plan, Decision, and Invariant entry has its matching detail file."
  009.md: "Predicate and oracle for: The Plan accepts idle and paused delivery, allows at most one active feature, and rejects malformed contracts or invalid prerequisites."
  010.md: "Predicate and oracle for: Direct master commits fail; integration uses current master, preserves feature commits, and retains the merged feature reference."
  011.md: "Predicate and oracle for: State requires complete recovery sections while allowing stale recorded Git facts to be reconciled on resume."
  012.md: "Predicate and oracle for: Ledger edits receive matching skill guidance without a new edit denial, preserving existing guard and complexity decisions."
  014.md: "Predicate and oracle for: Invalid lint configuration blocks with an actionable repair skill."
  015.md: "Predicate and oracle for: Supported language handlers distinguish named branch values from inline expressions and honor configured warning/block behavior with source locations."
  016.md: "Predicate and oracle for: Configuration checking and lint reject unsupported language selections with an actionable error."
  017.md: "Predicate and oracle for: Installed Rust/Python language defaults block unnamed conditions, functions above 40 nonblank lines and signatures above 4 inputs; boundary values pass."
  018.md: "Predicate and oracle for: Changed source or executable mode invalidates current check evidence, and a selected passing check never claims a full passing gate."
  019.md: "Predicate and oracle for: Resume reports real merge and rebase conflicts without modifying repository contents."
  020.md: "Predicate and oracle for: A new installation records correct shipped checksums, executable flags and ownership while retaining the baseline after user edits."
directories: {}
allow: []
deny: []
public: []
