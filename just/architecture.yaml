purpose: Group the thin Just recipes that forward to the configured runtime by responsibility
files:
  development.just: Bootstrap the pinned runtime, invoke the candidate and package releases
  commands.just: List and execute catalog commands, including sandboxed reads and authorized writes
  checks.just: Run the gate and validate configuration
  delivery.just: Resume work, report evidence and start or merge feature branches
  lint.just: Run lint and inspect rules, settings and selection
  jobs.just: Start, inspect, stop and clean managed background runs
directories: {}
